<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>اسپرلوس | مدیریت املاک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#152238;
  --navy-2:#1E3350;
  --navy-3:#26405F;
  --paper:#F4F1E9;
  --paper-2:#FFFFFF;
  --gold:#B08D4F;
  --gold-2:#D8B876;
  --on-gold:#152238;
  --badge-gold-bg:#FBF2E1;
  --badge-gold-text:#8A6A26;
  --emerald:#2F6F55;
  --emerald-2:#3E8B6C;
  --ink:#1B2230;
  --muted:#6B7280;
  --line:#E4DFD1;
  --danger:#B0473F;
  --danger-bg:#FBECEA;
  --ok-bg:#EAF3EC;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}
/* تم ۱ — روشن گرم (پیش‌فرض): کرم ملایم + سرمه‌ای + طلایی */
html[data-theme="light-warm"]{
  --navy:#152238; --navy-2:#1E3350; --navy-3:#26405F;
  --paper:#F4F1E9; --paper-2:#FFFFFF;
  --gold:#B08D4F; --gold-2:#D8B876; --on-gold:#152238;
  --badge-gold-bg:#FBF2E1; --badge-gold-text:#8A6A26;
  --emerald:#2F6F55; --emerald-2:#3E8B6C;
  --ink:#1B2230; --muted:#6B7280; --line:#E4DFD1;
  --danger:#B0473F; --danger-bg:#FBECEA; --ok-bg:#EAF3EC;
}
/* تم ۲ — روشن خنک: پس‌زمینه‌ی آبی‌خاکستری ملایم */
html[data-theme="light-cool"]{
  --navy:#1E3A5F; --navy-2:#28466E; --navy-3:#32557F;
  --paper:#EDF1F5; --paper-2:#FFFFFF;
  --gold:#1E5A82; --gold-2:#2E6DA4; --on-gold:#FFFFFF;
  --badge-gold-bg:#E3EEF5; --badge-gold-text:#1E5A82;
  --emerald:#2C7D6B; --emerald-2:#3C9683;
  --ink:#1B2635; --muted:#5C6B7A; --line:#D7E0E7;
  --danger:#B0473F; --danger-bg:#FBECEA; --ok-bg:#E7F2EF;
}
/* تم ۳ — روشن طبیعی: سبز مریمی ملایم، آرام و کم‌خستگی برای چشم */
html[data-theme="light-sage"]{
  --navy:#22392E; --navy-2:#2C463A; --navy-3:#355544;
  --paper:#F1F4EE; --paper-2:#FFFFFF;
  --gold:#8A6D3B; --gold-2:#A6863F; --on-gold:#FFFFFF;
  --badge-gold-bg:#F1E9D8; --badge-gold-text:#6B5429;
  --emerald:#3F7D5C; --emerald-2:#4F9370;
  --ink:#1E2A22; --muted:#66756B; --line:#DCE3D8;
  --danger:#B0473F; --danger-bg:#FBECEA; --ok-bg:#E7F0E9;
}
/* تم ۴ — تیره طلایی: هم‌راستا با آرم اسپرلوس (زغالی گرم + طلایی)، مناسب محیط کم‌نور */
html[data-theme="dark-gold"]{
  --navy:#121214; --navy-2:#1A1A1D; --navy-3:#222225;
  --paper:#121214; --paper-2:#1C1C20;
  --gold:#C9A227; --gold-2:#E4C767; --on-gold:#121214;
  --badge-gold-bg:#2E2812; --badge-gold-text:#E4C767;
  --emerald:#3E8B6C; --emerald-2:#4FA381;
  --ink:#EDE7D8; --muted:#9C9690; --line:#2C2C31;
  --danger:#E27367; --danger-bg:#3A2320; --ok-bg:#1F3129;
}
/* تم ۵ — تیره ملایم: خاکستری تیره (نه مشکی خالص)، برای استفاده‌ی طولانی‌مدت راحت‌تر برای چشم */
html[data-theme="dark-soft"]{
  --navy:#2B2E33; --navy-2:#33373D; --navy-3:#3C4046;
  --paper:#22252A; --paper-2:#2A2D33;
  --gold:#C7A76B; --gold-2:#D9BE8B; --on-gold:#2B2E33;
  --badge-gold-bg:#332C22; --badge-gold-text:#D9BE8B;
  --emerald:#5FA98A; --emerald-2:#6FB89A;
  --ink:#E6E3DD; --muted:#9BA0A6; --line:#3A3E44;
  --danger:#D98B80; --danger-bg:#3A2A28; --ok-bg:#25332C;
}
/* تم ۶ — تیره سرمه‌ای: آبی تیره خنک، جایگزین سردتر برای دو تم تیره‌ی گرم بالا */
html[data-theme="dark-navy"]{
  --navy:#12202E; --navy-2:#1A2C3D; --navy-3:#22394C;
  --paper:#16232F; --paper-2:#1E2E3D;
  --gold:#5FA8D3; --gold-2:#7FC0E8; --on-gold:#12202E;
  --badge-gold-bg:#1C2E3D; --badge-gold-text:#7FC0E8;
  --emerald:#4FA88A; --emerald-2:#5FBF9C;
  --ink:#E3EAF0; --muted:#93A3B0; --line:#2C3D4C;
  --danger:#E2867A; --danger-bg:#332427; --ok-bg:#1E3230;
}
:root{
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --sh-sm:0 1px 2px rgba(21,34,56,.06), 0 1px 1px rgba(21,34,56,.04);
  --sh-md:0 6px 16px rgba(21,34,56,.08), 0 2px 6px rgba(21,34,56,.05);
  --sh-lg:0 16px 40px rgba(21,34,56,.14), 0 4px 12px rgba(21,34,56,.06);
  --sh-gold:0 8px 22px rgba(176,141,79,.28);
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Vazirmatn',Tahoma,Arial,sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  padding-top:var(--safe-top);
  padding-bottom:var(--safe-bottom);
  padding-left:var(--safe-left);
  padding-right:var(--safe-right);
  transition:background .35s var(--ease), color .35s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font-family:'Vazirmatn',Tahoma,Arial,sans-serif;}
::selection{background:var(--gold-2);color:var(--on-gold);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--gold-2);border-radius:8px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--gold);background-clip:padding-box;}
*{scrollbar-width:thin;scrollbar-color:var(--gold-2) transparent;}

/* ---------- Keyframes ---------- */
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes popIn{0%{opacity:0;transform:scale(.85);}70%{transform:scale(1.03);}100%{opacity:1;transform:scale(1);}}
@keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(3%,-4%) scale(1.06);}66%{transform:translate(-3%,3%) scale(.96);}}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
@keyframes softPulse{0%,100%{box-shadow:0 0 0 0 rgba(176,141,79,.35);}50%{box-shadow:0 0 0 8px rgba(176,141,79,0);}}
@keyframes urgentPulse{0%,100%{box-shadow:0 0 0 0 rgba(176,71,63,.28);}50%{box-shadow:0 0 0 7px rgba(176,71,63,0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes iconFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes shineSweep{0%{transform:translateX(-130%) skewX(-15deg);}100%{transform:translateX(230%) skewX(-15deg);}}
@keyframes countRise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
}

/* ---------- Login ---------- */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  padding:24px;position:relative;overflow:hidden;
}
#login-screen::before,#login-screen::after{
  content:'';position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;pointer-events:none;
  animation:floatBlob 16s ease-in-out infinite;
}
#login-screen::before{width:420px;height:420px;background:radial-gradient(circle,var(--gold) 0%,transparent 70%);top:-140px;right:-120px;}
#login-screen::after{width:380px;height:380px;background:radial-gradient(circle,var(--gold-2) 0%,transparent 70%);bottom:-160px;left:-100px;animation-delay:-8s;}
.login-card{
  background:var(--paper-2);border-radius:var(--r-xl);padding:36px 30px;width:100%;max-width:420px;
  box-shadow:var(--sh-lg), 0 40px 80px rgba(0,0,0,.35);
  border-top:5px solid var(--gold);position:relative;z-index:1;
  animation:scaleIn .55s var(--ease-out) both;
}
.brand{
  text-align:center;margin-bottom:22px;
}
.brand .mark{
  width:64px;height:64px;border-radius:16px;margin:0 auto 12px;
  background:linear-gradient(135deg,var(--gold),var(--gold-2));
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;color:var(--navy);
  box-shadow:var(--sh-gold);position:relative;overflow:hidden;
}
.brand .mark::after{
  content:'';position:absolute;inset:0;width:40%;
  background:linear-gradient(75deg,transparent,rgba(255,255,255,.55),transparent);
  animation:shineSweep 3.2s ease-in-out infinite;
}
.brand h1{font-size:22px;margin:0;font-weight:800;color:var(--navy);}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px;letter-spacing:.5px;}
.role-tabs{display:flex;gap:8px;margin-bottom:18px;background:var(--paper);border-radius:12px;padding:4px;}
.role-tab{flex:1;text-align:center;padding:10px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px;transition:.2s var(--ease);}
.role-tab.active{background:var(--navy);color:#fff;box-shadow:var(--sh-sm);}
.field{margin-bottom:14px;animation:fadeInUp .5s var(--ease-out) both;}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);font-size:14px;color:var(--ink);
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease), transform .15s var(--ease);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,79,.15);}
.field input:hover,.field select:hover,.field textarea:hover{border-color:var(--gold-2);}

/* ---------- تقویم شمسی (انتخاب‌گر تاریخ) ---------- */
.jalali-date-field{position:relative;}
.jalali-date-field input{cursor:pointer;background:var(--paper-2);caret-color:transparent;}
.jalali-date-field .jf-ic{position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:12px;pointer-events:none;color:var(--gold);font-size:15px;opacity:.9;}
.jalali-picker-popup{
  position:fixed;z-index:500;width:296px;max-width:calc(100vw - 16px);background:var(--paper-2);border-radius:var(--r-lg);
  box-shadow:var(--sh-lg),0 0 0 1px var(--line);padding:14px;direction:rtl;font-family:'Vazirmatn',Tahoma,Arial,sans-serif;
  animation:scaleIn .18s var(--ease-out) both;border-top:3px solid var(--gold);
}
.jp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.jp-title{font-weight:800;font-size:14px;color:var(--ink);}
.jp-nav{
  width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--paper);
  color:var(--navy);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.15s var(--ease);flex-shrink:0;
}
.jp-nav:hover{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--on-gold);border-color:var(--gold);transform:scale(1.06);}
.jp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px;}
.jp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.jp-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:12.5px;cursor:pointer;color:var(--ink);transition:.15s var(--ease);}
.jp-cell.jp-empty{cursor:default;}
.jp-day:hover{background:rgba(176,141,79,.16);transform:scale(1.08);}
.jp-today{border:1px solid var(--gold-2);font-weight:800;color:var(--gold);}
.jp-selected{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--on-gold);font-weight:800;box-shadow:var(--sh-gold);}
.jp-selected:hover{transform:none;}
.jp-footer{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
.jp-quick{background:none;border:none;color:var(--emerald);font-size:12px;font-weight:700;cursor:pointer;padding:5px 9px;border-radius:7px;transition:.15s var(--ease);}
.jp-quick:hover{background:var(--ok-bg);}
.jp-clear{color:var(--danger);}
.jp-clear:hover{background:var(--danger-bg);}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden;
  padding:11px 18px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:14px;
  transition:transform .18s var(--ease-spring), box-shadow .2s var(--ease), background .2s var(--ease), filter .2s var(--ease), opacity .2s;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.96);}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.btn-primary{background:var(--navy);color:#fff;box-shadow:var(--sh-sm);}
.btn-primary:hover{background:var(--navy-2);transform:translateY(-2px);box-shadow:var(--sh-md);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--on-gold);box-shadow:var(--sh-gold);}
.btn-gold:hover{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 12px 28px rgba(176,141,79,.38);}
.btn-emerald{background:var(--emerald);color:#fff;box-shadow:var(--sh-sm);}
.btn-emerald:hover{background:var(--emerald-2);transform:translateY(-2px);box-shadow:var(--sh-md);}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--navy);background:rgba(21,34,56,.04);transform:translateY(-1px);}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-danger:hover{filter:brightness(.97);transform:translateY(-1px);}
.btn-block{width:100%;}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px;}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none !important;}
.hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center;line-height:1.7;}

/* ---------- App shell ---------- */
#app-screen{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:250px;flex-shrink:0;background:linear-gradient(190deg,var(--navy) 0%,var(--navy-2) 100%);color:#EDE7D8;
  display:flex;flex-direction:column;padding:18px 14px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  transition:transform .3s var(--ease-out);
  box-shadow:2px 0 0 rgba(255,255,255,.03) inset;
}
.sidebar .brand-mini{display:flex;align-items:center;gap:10px;padding:6px 6px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px;}
.sidebar .brand-mini .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-2));display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--on-gold);font-size:16px;box-shadow:var(--sh-gold);}
.sidebar .brand-mini div b{display:block;font-size:14px;}
.sidebar .brand-mini div span{font-size:11px;opacity:.65;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;
  font-size:13.5px;color:#CBD3DE;margin-bottom:3px;font-weight:600;
  transition:background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(-2px);}
.nav-item.active{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--on-gold);box-shadow:0 6px 16px rgba(0,0,0,.25);font-weight:700;}
.nav-item .ic{width:18px;text-align:center;transition:transform .2s var(--ease);}
.nav-item:hover .ic{transform:scale(1.15);}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);}
.user-chip{display:flex;align-items:center;gap:8px;padding:8px;font-size:12.5px;color:#cbd3de;}
.user-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--emerald-2);box-shadow:0 0 0 3px rgba(63,139,108,.25);animation:softPulse 2.4s ease-in-out infinite;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(244,241,233,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:14px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 1px 0 rgba(21,34,56,.02);
}
.topbar h2{margin:0;font-size:17px;font-weight:800;color:var(--ink);animation:fadeIn .4s var(--ease-out);}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.hamburger{display:none;background:var(--navy);color:#fff;border:none;border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;transition:transform .15s var(--ease-spring), background .15s;}
.hamburger:active{transform:scale(.9) rotate(90deg);}
.content{padding:20px 22px 90px;flex:1;animation:fadeInUp .4s var(--ease-out) both;}

.mobile-tabbar{display:none;}

/* ---------- Cards / lists ---------- */
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.tab-btn{
  padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper-2);cursor:pointer;
  font-weight:700;font-size:13px;color:var(--muted);transition:.2s var(--ease);
}
.tab-btn:hover{border-color:var(--gold-2);color:var(--ink);transform:translateY(-1px);}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:var(--sh-sm);}
.tab-count{display:inline-block;min-width:20px;padding:1px 6px;margin-inline-start:5px;border-radius:999px;background:rgba(21,34,56,.08);color:inherit;font-size:11px;font-weight:800;vertical-align:middle;transition:background .2s var(--ease);}
.tab-btn.active .tab-count{background:rgba(255,255,255,.25);}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;background:var(--paper-2);padding:12px;border-radius:14px;border:1px solid var(--line);transition:box-shadow .2s var(--ease), border-color .2s var(--ease);}
.toolbar:focus-within{box-shadow:0 0 0 3px rgba(176,141,79,.12);border-color:var(--gold-2);}
.toolbar input[type=text],.toolbar select,.toolbar input[type=number]{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:var(--paper);transition:border-color .2s var(--ease), box-shadow .2s var(--ease);}
.toolbar input[type=text]:focus,.toolbar select:focus,.toolbar input[type=number]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,79,.12);}
.toolbar .grow{flex:1;min-width:160px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.card{
  background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;
  box-shadow:var(--sh-sm);
  transition:transform .25s var(--ease-out), box-shadow .25s var(--ease-out), border-color .25s var(--ease-out);
  animation:fadeInUp .45s var(--ease-out) both;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:var(--gold-2);}
.grid .card:nth-child(1){animation-delay:.02s;} .grid .card:nth-child(2){animation-delay:.06s;}
.grid .card:nth-child(3){animation-delay:.10s;} .grid .card:nth-child(4){animation-delay:.14s;}
.grid .card:nth-child(5){animation-delay:.18s;} .grid .card:nth-child(6){animation-delay:.22s;}
.grid .card:nth-child(7){animation-delay:.26s;} .grid .card:nth-child(8){animation-delay:.30s;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.card-title{font-weight:800;font-size:15px;color:var(--ink);}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:700;display:inline-block;animation:popIn .3s var(--ease-spring) both;}
.badge-gold{background:var(--badge-gold-bg);color:var(--badge-gold-text);}
.badge-emerald{background:var(--ok-bg);color:var(--emerald);}
.badge-navy{background:#E9EEF5;color:var(--navy);}
.badge-danger{background:var(--danger-bg);color:var(--danger);}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12.5px;margin:10px 0;}
.kv div span{display:block;}
.kv .k{color:var(--muted);font-size:11px;}
.kv .v{font-weight:700;color:var(--ink);}
.price-box{background:var(--paper);border-radius:10px;padding:10px 12px;margin:10px 0;border:1px dashed var(--line);transition:border-color .2s var(--ease), background .2s var(--ease);}
.card:hover .price-box{border-color:var(--gold-2);}
.price-box .main-price{font-weight:800;color:var(--ink);font-size:15px;}
.price-box .words{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6;}
.desc-box{font-size:12.5px;color:var(--ink);background:var(--paper);border-radius:10px;padding:10px;margin:8px 0;line-height:1.8;}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.phone-link{color:var(--emerald);font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:transform .15s var(--ease), color .15s;}
.phone-link:hover{text-decoration:underline;transform:translateX(-2px);color:var(--emerald-2);}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);animation:fadeIn .5s var(--ease-out) both;}
.empty-state .ic{font-size:40px;margin-bottom:10px;display:inline-block;animation:iconFloat 3s ease-in-out infinite;}
.meta-line{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;}

/* Modal / form */
.overlay{position:fixed;inset:0;background:rgba(21,20,15,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:24px 14px;overflow-y:auto;animation:fadeIn .2s var(--ease-out);}
.overlay.show{display:flex;}
.modal{background:var(--paper-2);border-radius:18px;max-width:640px;width:100%;padding:22px;margin-top:20px;box-shadow:var(--sh-lg);animation:scaleIn .3s var(--ease-out) both;}
.modal h3{margin:0 0 16px;color:var(--ink);font-size:17px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.form-grid .full{grid-column:1/-1;}
.section-label{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--gold);margin:6px 0 -2px;text-transform:uppercase;letter-spacing:.5px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;border-top:1px solid var(--line);padding-top:16px;}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px) scale(.92);background:var(--navy);color:#fff;
  padding:12px 22px;border-radius:999px;font-size:13px;font-weight:700;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;transition:opacity .28s var(--ease-out), transform .28s var(--ease-spring), bottom .28s var(--ease-out);
}
.toast.show{opacity:1;bottom:34px;transform:translateX(-50%) translateY(0) scale(1);}

/* ---------- بنر دائمیِ «تغییرات ذخیره‌نشده» ----------
   برخلاف toast که چند ثانیه دیده می‌شود و می‌تواند با toast بعدی (مثلاً «ذخیره شد ✓» که
   بدون بررسی نتیجه‌ی واقعی ذخیره‌سازی نمایش داده می‌شود) پنهان شود، این بنر تا وقتی
   تغییرات واقعاً روی سرور ذخیره نشده‌اند، ثابت روی صفحه می‌ماند. */
.unsaved-banner{
  position:fixed;top:0;right:0;left:0;z-index:400;background:linear-gradient(90deg,#7A3B1E,#9C5423);color:#FFF2E4;
  padding:10px 16px;font-size:12.5px;font-weight:700;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25);
  transform:translateY(-110%);transition:transform .3s var(--ease-out);
}
.unsaved-banner.show{transform:translateY(0);}
.unsaved-banner .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#FFD48A;margin-left:6px;animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px;}
.stat-card{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden;
  box-shadow:var(--sh-sm);transition:transform .25s var(--ease-out), box-shadow .25s var(--ease-out);animation:fadeInUp .45s var(--ease-out) both;}
.stat-card::before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-2));opacity:.85;}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--sh-md);}
.stat-grid .stat-card:nth-child(1){animation-delay:.02s;} .stat-grid .stat-card:nth-child(2){animation-delay:.07s;}
.stat-grid .stat-card:nth-child(3){animation-delay:.12s;} .stat-grid .stat-card:nth-child(4){animation-delay:.17s;}
.stat-card .n{font-size:24px;font-weight:800;color:var(--ink);animation:countRise .4s var(--ease-out) both;}
.stat-card .l{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600;}
.alarm-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;transition:transform .2s var(--ease), box-shadow .2s var(--ease);animation:fadeInUp .4s var(--ease-out) both;}
.alarm-item:hover{transform:translateX(-2px);box-shadow:var(--sh-sm);}
.alarm-item.urgent{border-color:var(--danger);background:var(--danger-bg);animation:fadeInUp .4s var(--ease-out) both, urgentPulse 2.6s ease-in-out infinite;}
.section-title{font-size:15px;font-weight:800;color:var(--ink);margin:22px 0 12px;display:flex;align-items:center;gap:8px;position:relative;padding-inline-start:2px;}
.section-title::after{content:'';flex:0 0 auto;width:26px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-2));margin-inline-start:4px;}
.table-wrap{overflow-x:auto;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-sm);}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:700px;}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:var(--paper);color:var(--muted);font-weight:700;font-size:11.5px;position:sticky;top:0;z-index:1;}
tr{transition:background .15s var(--ease);}
tbody tr:hover{background:rgba(176,141,79,.06);}
tr:last-child td{border-bottom:none;}
.img-thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;transition:transform .2s var(--ease), box-shadow .2s var(--ease);}
.img-thumb:hover{transform:scale(1.12);box-shadow:var(--sh-md);position:relative;z-index:2;}
.upload-box{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;font-size:12.5px;color:var(--muted);transition:.2s var(--ease);}
.upload-box:hover{border-color:var(--gold);background:rgba(176,141,79,.05);color:var(--ink);transform:translateY(-1px);}
.photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.photo-row .ph{position:relative;animation:popIn .3s var(--ease-spring) both;}
.photo-row .ph img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);transition:transform .2s var(--ease);}
.photo-row .ph img:hover{transform:scale(1.08);}
.photo-row .ph button{position:absolute;top:-6px;left:-6px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;line-height:1;transition:transform .15s var(--ease-spring);}
.photo-row .ph button:hover{transform:scale(1.2);}

@media (max-width:880px){
  .sidebar{position:fixed;right:0;top:0;height:100vh;transform:translateX(102%);transition:.25s;z-index:60;box-shadow:-10px 0 30px rgba(0,0,0,.3);}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:block;}
  .content{padding:16px 14px 100px;}
  .topbar{padding:12px 14px;}
  .form-grid{grid-template-columns:1fr;}
  .kv{grid-template-columns:1fr 1fr;}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;backdrop-filter:blur(2px);animation:fadeIn .2s var(--ease-out);}
  .sidebar-backdrop.show{display:block;}
}

/* ---------- Loading spinner (login) ---------- */
.spinner-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;color:#EDE7D8;font-family:'Vazirmatn',Tahoma,Arial,sans-serif;animation:fadeIn .4s var(--ease-out);}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(216,184,118,.25);border-top-color:var(--gold-2);animation:spin .8s linear infinite;}

/* ---------- Skeleton loading ---------- */
.skel{background:linear-gradient(90deg,var(--line) 25%,rgba(255,255,255,.55) 50%,var(--line) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:8px;}

/* ---------- ماشین‌حساب کمیسیون ---------- */
.cc-hero{background:linear-gradient(135deg,var(--navy),var(--navy-2) 55%,var(--navy-3));border-radius:20px;padding:22px 20px;color:#EDE7D8;margin-bottom:16px;box-shadow:var(--sh-lg);position:relative;overflow:hidden;}
.cc-hero::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% -10%, rgba(216,184,118,.28), transparent 55%);}
.cc-hero h2{position:relative;font-size:19px;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
.cc-hero p{position:relative;margin:0;font-size:12.5px;opacity:.75;line-height:1.8;}
.cc-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start;}
@media (max-width:880px){.cc-grid{grid-template-columns:1fr;}}
.cc-card{background:var(--paper-2);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--sh-md);}
.cc-tabs{display:flex;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:18px;}
.cc-tab{flex:1;text-align:center;padding:10px 8px;border-radius:10px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted);transition:.18s;user-select:none;}
.cc-tab.active{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--on-gold);box-shadow:var(--sh-gold);}
.cc-field{margin-bottom:16px;}
.cc-field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:7px;}
.cc-field input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;font-family:inherit;background:var(--paper);color:var(--ink);transition:.15s;}
.cc-field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,79,.15);}
.cc-note{font-size:11.5px;color:var(--muted);line-height:1.8;background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;}
.cc-result{background:linear-gradient(160deg,#152238 0%,#1E3350 100%);border-radius:18px;padding:20px;color:#EDE7D8;position:relative;overflow:hidden;min-height:100%;}
.cc-result::after{content:'🧮';position:absolute;left:-10px;bottom:-18px;font-size:90px;opacity:.06;}
.cc-result-title{position:relative;font-size:12.5px;opacity:.7;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.cc-result-row{position:relative;display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:13.5px;}
.cc-result-row:last-of-type{border-bottom:none;}
.cc-result-row b{font-size:15px;color:#F3E7C9;font-weight:800;}
.cc-result-row.main{margin-top:6px;padding:16px 14px;background:linear-gradient(135deg,rgba(216,184,118,.18),rgba(176,141,79,.1));border-radius:14px;border:1px solid rgba(216,184,118,.35);}
.cc-result-row.main span{font-weight:700;color:#F3E7C9;}
.cc-result-row.main b{font-size:19px;color:var(--gold-2);}
.cc-result-words{position:relative;margin-top:12px;font-size:11.5px;opacity:.65;line-height:1.9;}
</style>
</head>

}

const FILE_STATUS_ORDER = ['active','negotiating','contracted','closed','expired'];
function fileStatusMeta(item){
  const id = (item && item.status) || 'active';
  const map = {
    active:      { id:'active',      label:'فعال',                 emoji:'🟢', color:'#16a34a' },
    negotiating: { id:'negotiating', label:'در حال مذاکره',        emoji:'🟡', color:'#ca8a04' },
    contracted:  { id:'contracted',  label:'قرارداد شد',           emoji:'🔵', color:'#2563eb' },
    closed:      { id:'closed',      label: (item && item.dealType==='sale') ? 'فروخته شد' : 'اجاره رفت', emoji:'🔴', color:'#dc2626' },
    expired:     { id:'expired',     label:'منقضی / غیرفعال',      emoji:'⚫', color:'#4b5563' },
  };
  return map[id] || map.active;
}
function fileStatusOptionsHtml(item){
  return FILE_STATUS_ORDER.map(id=>{
    const meta = fileStatusMeta(Object.assign({}, item, {status:id}));
    return `<option value="${id}" ${((item&&item.status)||'active')===id?'selected':''}>${meta.emoji} ${meta.label}</option>`;
  }).join('');
}
const ARCHIVE_STATUSES = ['closed','expired'];
function isArchivedFile(item){ return ARCHIVE_STATUSES.includes((item&&item.status)||'active'); }
let __statusSaveInFlight = 0; // وقتی >۰ است، به‌روزرسانی دوره‌ای از سرور موقتاً متوقف می‌شود تا تغییر خوش‌بینانه‌ی محلی رونویسی (overwrite) نشود
async function setFileStatus(id, status){
  const item = DB.files.find(f=>f.id===id); if(!item) return;
  const prevStatus = item.status || 'active';
  const prevArchivedAt = item.archivedAt;
  if(prevStatus === status) return;

  // ۱) به‌روزرسانی خوش‌بینانه: فوراً همین‌جا نمایش داده می‌شود، بدون منتظر ماندن برای پاسخ سرور
  item.status = status;
  item.updatedAt = nowIso();
  const nowArchived = ARCHIVE_STATUSES.includes(status);
  if(nowArchived && !ARCHIVE_STATUSES.includes(prevStatus)) item.archivedAt = item.updatedAt;
  if(!nowArchived) item.archivedAt = null;
  renderApp();

  // شماره‌ی این درخواست برای همین فایل؛ اگر کاربر قبل از برگشتن پاسخ دوباره وضعیت را عوض کند،
  // پاسخ این درخواست قدیمی نادیده گرفته می‌شود تا آخرین کلیک همیشه برنده باشد
  const myReq = (item.__statusReq = (item.__statusReq||0) + 1);
  __statusSaveInFlight++;
  try{
    const r = await apiFetch('/api/files/'+encodeURIComponent(id)+'/status', {method:'PATCH', body: JSON.stringify({status})});
    if(item.__statusReq === myReq && r && r.item){
      item.status = r.item.status; item.updatedAt = r.item.updatedAt; item.archivedAt = r.item.archivedAt;
      toast('وضعیت فایل به‌روزرسانی شد ✓');
    }
  }catch(e){
    if(item.__statusReq === myReq){
      // ناموفق بود؛ به وضعیت قبلی برگردان تا نمایش با واقعیت سرور یکی بماند
      item.status = prevStatus; item.updatedAt = nowIso(); item.archivedAt = prevArchivedAt;
      toast('خطا در ذخیره‌سازی وضعیت — دوباره تلاش کنید');
    }
  } finally {
    __statusSaveInFlight--;
    renderApp();
  }
}

function uid(){ return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function nowIso(){ return new Date().toISOString(); }
function faDate(iso){ if(!iso) return '—'; try{ return new Date(iso).toLocaleDateString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'}); }catch(e){ return '—'; } }
function faDateTime(iso){ if(!iso) return '—'; try{ return new Date(iso).toLocaleDateString('fa-IR')+' - '+new Date(iso).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return '—'; } }
function addDays(iso, days){ const d = iso? new Date(iso): new Date(); d.setDate(d.getDate()+Number(days||0)); return d.toISOString(); }
function daysBetween(iso1, iso2){ const a=new Date(iso1), b=new Date(iso2); return Math.round((b-a)/(1000*60*60*24)); }

/* =========================================================================
   تقویم شمسی (جلالی) — الگوریتم استاندارد و دقیق تبدیل میلادی↔شمسی
   بر پایه‌ی شماره روز ژولیوسی (JDN)، بدون هیچ کتابخانه‌ی بیرونی
   ========================================================================= */
function jdDiv(a,b){ return ~~(a/b); }
function jdMod(a,b){ return a - ~~(a/b)*b; }
const JALALI_BREAKS = [-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){
  const bl = JALALI_BREAKS.length;
  const gy = jy + 621;
  let leapJ = -14, jp = JALALI_BREAKS[0];
  if (jy < jp || jy >= JALALI_BREAKS[bl-1]) return { leap:0, gy, march:20 }; // خارج از بازه: مقدار امن پیش‌فرض
  let jump = 0;
  for (let i = 1; i < bl; i++) {
    const jm = JALALI_BREAKS[i];
    jump = jm - jp;
    if (jy < jm) break;
    leapJ += jdDiv(jump, 33) * 8 + jdDiv(jdMod(jump, 33), 4);
    jp = jm;
  }
  let n = jy - jp;
  leapJ += jdDiv(n, 33) * 8 + jdDiv(jdMod(n, 33) + 3, 4);
  if (jdMod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
  const leapG = jdDiv(gy, 4) - jdDiv((jdDiv(gy, 100) + 1) * 3, 4) - 150;
  const march = 20 + leapJ - leapG;
  if (jump - n < 6) n = n - jump + jdDiv(jump + 4, 33) * 33;
  let leap = jdMod(jdMod(n + 1, 33) - 1, 4);
  if (leap === -1) leap = 4;
  return { leap, gy, march };
}
function isLeapJalaliYear(jy){ return jalCal(jy).leap === 0; }
function jalaliMonthLength(jy, jm){ if(jm<=6) return 31; if(jm<=11) return 30; return isLeapJalaliYear(jy)?30:29; }
function gregorianToJdn(gy, gm, gd){
  let d = jdDiv((gy + jdDiv(gm - 8, 6) + 100100) * 1461, 4) + jdDiv(153 * jdMod(gm + 9, 12) + 2, 5) + gd - 34840408;
  d = d - jdDiv(jdDiv(gy + 100100 + jdDiv(gm - 8, 6), 100) * 3, 4) + 752;
  return d;
}
function jdnToGregorian(jdn){
  let j = 4 * jdn + 139361631;
  j = j + jdDiv(jdDiv(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
  const i = jdDiv(jdMod(j, 1461), 4) * 5 + 308;
  const gd = jdDiv(jdMod(i, 153), 5) + 1;
  const gm = jdMod(jdDiv(i, 153), 12) + 1;
  const gy = jdDiv(j, 1461) - 100100 + jdDiv(8 - gm, 6);
  return [gy, gm, gd];
}
function jalaliToJdn(jy, jm, jd){
  const r = jalCal(jy);
  return gregorianToJdn(r.gy, 3, r.march) + (jm - 1) * 31 - jdDiv(jm, 7) * (jm - 7) + jd - 1;
}
function jdnToJalali(jdn){
  const gy = jdnToGregorian(jdn)[0];
  let jy = gy - 621;
  const r = jalCal(jy);
  const jdn1f = gregorianToJdn(gy, 3, r.march);
  let k = jdn - jdn1f, jm, jd;
  if (k >= 0) {
    if (k <= 185) { jm = 1 + jdDiv(k, 31); jd = jdMod(k, 31) + 1; return [jy, jm, jd]; }
    k -= 186;
  } else {
    jy -= 1; k += 179;
    if (r.leap === 1) k += 1;
  }
  jm = 7 + jdDiv(k, 30); jd = jdMod(k, 30) + 1;
  return [jy, jm, jd];
}
function gregorianToJalali(gy, gm, gd){ return jdnToJalali(gregorianToJdn(gy, gm, gd)); }
function jalaliToGregorian(jy, jm, jd){ return jdnToGregorian(jalaliToJdn(jy, jm, jd)); }
function jalaliFirstDayOfWeek(jy, jm){ // ۰=شنبه ... ۶=جمعه
  const [gy,gm,gd] = jalaliToGregorian(jy, jm, 1);
  const jsDay = new Date(Date.UTC(gy, gm-1, gd)).getUTCDay(); // ۰=یکشنبه در جاوااسکریپت
  return (jsDay + 1) % 7;
}
function toPersianDigits(x){ const map={'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'}; return String(x).replace(/[0-9]/g, d=>map[d]); }
function isoToJalali(iso){
  if(!iso) return null;
  const parts = String(iso).slice(0,10).split('-').map(Number);
  if(parts.length<3 || parts.some(n=>isNaN(n))) return null;
  return gregorianToJalali(parts[0], parts[1], parts[2]);
}
function isoToJalaliDisplay(iso){
  const j = isoToJalali(iso);
  if(!j) return '';
  return toPersianDigits(j[0])+'/'+toPersianDigits(String(j[1]).padStart(2,'0'))+'/'+toPersianDigits(String(j[2]).padStart(2,'0'));
}
const JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const JALALI_WEEKDAYS = ['ش','ی','د','س','چ','پ','ج'];

/* ---------- تقویم شمسیِ باز‌شونده (پاپ‌آپ) برای انتخاب تاریخ ---------- */
let __jalaliPicker = null;
function openJalaliPicker(inputEl){
  if(__jalaliPicker && __jalaliPicker.inputEl===inputEl){ closeJalaliPicker(); return; }
  const key = inputEl.getAttribute('data-key');
  const iso = (__formState && __formState[key]) || '';
  const j = isoToJalali(iso) || isoToJalali(todayStr());
  __jalaliPicker = { key, inputEl, viewYear:j[0], viewMonth:j[1], selYear: iso? j[0]:null, selMonth: iso? j[1]:null, selDay: iso? j[2]:null };
  renderJalaliPicker();
  document.addEventListener('mousedown', jalaliPickerOutsideClick, true);
  window.addEventListener('resize', positionJalaliPicker);
  window.addEventListener('scroll', positionJalaliPicker, true);
}
function renderJalaliPicker(){
  const P = __jalaliPicker; if(!P) return;
  let el = document.getElementById('jalali-picker-popup');
  if(!el){ el = document.createElement('div'); el.id='jalali-picker-popup'; el.className='jalali-picker-popup'; document.body.appendChild(el); }
  const daysInMonth = jalaliMonthLength(P.viewYear, P.viewMonth);
  const firstDow = jalaliFirstDayOfWeek(P.viewYear, P.viewMonth);
  const todayJ = isoToJalali(todayStr());
  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="jp-cell jp-empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const isToday = todayJ[0]===P.viewYear && todayJ[1]===P.viewMonth && todayJ[2]===d;
    const isSel = P.selYear===P.viewYear && P.selMonth===P.viewMonth && P.selDay===d;
    cells += `<div class="jp-cell jp-day ${isToday?'jp-today':''} ${isSel?'jp-selected':''}" onclick="pickJalaliDay(${d})">${toPersianDigits(d)}</div>`;
  }
  el.innerHTML = `
    <div class="jp-header">
      <button type="button" class="jp-nav" onclick="jalaliPickerNav(1)" title="ماه بعد">‹</button>
      <div class="jp-title">${JALALI_MONTHS[P.viewMonth-1]} ${toPersianDigits(P.viewYear)}</div>
      <button type="button" class="jp-nav" onclick="jalaliPickerNav(-1)" title="ماه قبل">›</button>
    </div>
    <div class="jp-weekdays">${JALALI_WEEKDAYS.map(w=>`<div>${w}</div>`).join('')}</div>
    <div class="jp-grid">${cells}</div>
    <div class="jp-footer">
      <button type="button" class="jp-quick" onclick="jalaliPickerToday()">📍 امروز</button>
      <button type="button" class="jp-quick jp-clear" onclick="jalaliPickerClear()">پاک کردن</button>
    </div>`;
  el.style.visibility='hidden'; el.style.display='block';
  requestAnimationFrame(()=>{ positionJalaliPicker(); el.style.visibility='visible'; });
}
function positionJalaliPicker(){
  const P = __jalaliPicker; const el = document.getElementById('jalali-picker-popup');
  if(!P || !el || !P.inputEl || !document.body.contains(P.inputEl)){ closeJalaliPicker(); return; }
  const r = P.inputEl.getBoundingClientRect();
  const popW = el.offsetWidth || 296, popH = el.offsetHeight || 340;
  let top = r.bottom + 8, left = r.left;
  if(top + popH > window.innerHeight - 8) top = Math.max(8, r.top - popH - 8);
  if(left + popW > window.innerWidth - 8) left = Math.max(8, window.innerWidth - popW - 8);
  el.style.top = top+'px'; el.style.left = left+'px';
}
function jalaliPickerNav(dir){
  const P = __jalaliPicker; if(!P) return;
  P.viewMonth += dir;
  if(P.viewMonth>12){ P.viewMonth=1; P.viewYear++; }
  if(P.viewMonth<1){ P.viewMonth=12; P.viewYear--; }
  renderJalaliPicker();
}
function pickJalaliDay(d){
  const P = __jalaliPicker; if(!P) return;
  const [gy,gm,gd] = jalaliToGregorian(P.viewYear, P.viewMonth, d);
  const iso = gy+'-'+String(gm).padStart(2,'0')+'-'+String(gd).padStart(2,'0');
  applyJalaliDateToField(iso);
}
function jalaliPickerToday(){ applyJalaliDateToField(todayStr()); }
function jalaliPickerClear(){ applyJalaliDateToField(''); }
function applyJalaliDateToField(iso){
  const P = __jalaliPicker; if(!P) return;
  __formState[P.key] = iso;
  if(P.inputEl){ P.inputEl.value = iso? isoToJalaliDisplay(iso) : ''; P.inputEl.dataset.iso = iso||''; }
  if(typeof recomputeForm==='function') recomputeForm();

}
function jalaliPickerOutsideClick(e){
  const el = document.getElementById('jalali-picker-popup');
  if(!el) return;
  if(el.contains(e.target)) return;
  if(e.target && e.target.hasAttribute && e.target.hasAttribute('data-jalali')) return; // کلیک روی خودِ اینپوت را دست‌نخورده بگذار (toggle خودش مدیریت می‌شود)
  closeJalaliPicker();
}
function closeJalaliPicker(){
  const el = document.getElementById('jalali-picker-popup');
  if(el) el.remove();
  __jalaliPicker = null;
  document.removeEventListener('mousedown', jalaliPickerOutsideClick, true);
  window.removeEventListener('resize', positionJalaliPicker);
  window.removeEventListener('scroll', positionJalaliPicker, true);
}

function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- عدد به حروف فارسی ---------- */
function numberToWordsFa(num){
  num = Math.round(Number(num||0));
  if(num===0) return 'صفر تومان';
  const ones=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];
  const teens=['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
  const tens=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
  const hundreds=['','یکصد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
  const scales=['',' هزار',' میلیون',' میلیارد',' هزار میلیارد',' میلیون میلیارد'];
  function threeDigit(n){
    let parts=[];
    const h=Math.floor(n/100), t=n%100;
    if(h) parts.push(hundreds[h]);
    if(t>=10 && t<20) parts.push(teens[t-10]);
    else{
      const tt=Math.floor(t/10), o=t%10;
      if(tt) parts.push(tens[tt]);
      if(o) parts.push(ones[o]);
    }
    return parts.join(' و ');
  }
  let neg = num<0; num=Math.abs(num);
  let groups=[]; let n=num;
  if(n===0) groups=[0];
  while(n>0){ groups.unshift(n%1000); n=Math.floor(n/1000); }
  let words=[];
  const total=groups.length;
  groups.forEach((g,i)=>{
    if(g===0) return;
    const scaleIdx = total-1-i;
    words.push(threeDigit(g)+(scales[scaleIdx]||''));
  });
  return (neg?'منفی ':'')+words.join(' و ')+' تومان';
}

/* ---------- شباهت قیمت ---------- */
function priceSimilarity(a,b){
  a=Number(a||0); b=Number(b||0);
  if(a===0 && b===0) return 1;
  if(a===0 || b===0) return 0;
  return 1 - Math.abs(a-b)/Math.max(a,b);
}

/* ---------- Storage layer: اتصال به بک‌اند واقعی ---------- */
const API_BASE = ''; // چون سرور خودش همین فایل را هم سرو می‌کند، آدرس نسبی کافی است
let TOKEN = localStorage.getItem('sl_token') || null;

async function apiFetch(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(TOKEN) headers['Authorization'] = 'Bearer '+TOKEN;
  let res;
  try{
    res = await fetch(API_BASE+path, Object.assign({}, opts, {headers}));
  }catch(e){
    toast('اتصال به سرور برقرار نشد. اینترنت یا آدرس سرور را بررسی کنید.');
    throw e;
  }
  if(res.status===401){
    TOKEN=null; localStorage.removeItem('sl_token'); SESSION=null;
    renderLogin();
    throw new Error('unauthorized');
  }
  let body=null;
  try{ body = await res.json(); }catch(e){}
  if(!res.ok){
    const err = new Error((body&&body.error)||'request_failed');
    err.body = body;
    throw err;
  }
  return body;
}

// نکته‌ی مهم (رفع باگ «فایل ثبت‌شده بعد از مدتی گم می‌شد»، ریشه‌ی واقعی):
// قبلاً اگر یک درخواست GET برای گرفتن یک بخش از داده (مثلاً sl_files) به هر دلیلی
// (قطعی موقت اینترنت، ری‌استارت لحظه‌ای سرور، تایم‌اوت و ...) شکست می‌خورد، این تابع
// خطا را بی‌صدا می‌بلعید و null برمی‌گرداند؛ در loadAll() این null به آرایه‌ی خالی []
// تبدیل می‌شد — یعنی یک خطای موقتِ شبکه، در نسخه‌ی محلی برنامه دقیقاً مثل «سرور گفته
// هیچ فایلی نداری» تفسیر می‌شد و کل لیست روی صفحه خالی می‌شد. بدتر از آن، چون این اتفاق
// داخل poll دوره‌ای رخ می‌داد، «امضای» آخرین وضعیت سرور را هم به‌روز می‌کرد، پس دفعه‌ی
// بعد چون امضا با قبل یکی بود، برنامه اصلاً دوباره تلاش نمی‌کرد و همان‌جا (روی خالی)
// برای همیشه می‌ماند تا کاربر صفحه را رفرش کند. راه‌حل: خطا را دیگر نبلع؛ اجازه بده به
// بالا (loadAll) برسد تا آنجا تصمیم درست گرفته شود.
async function storageGet(key){
  const r = await apiFetch('/api/storage/'+encodeURIComponent(key));
  return (r && r.value!==null && r.value!==undefined) ? JSON.parse(r.value) : null;
}
async function storageSet(key, value){
  try{
    await apiFetch('/api/storage/'+encodeURIComponent(key), {method:'PUT', body: JSON.stringify({value: JSON.stringify(value)})});
    return true;
  }catch(e){ console.error('storage set failed', key, e); toast('خطا در ذخیره‌سازی روی سرور'); return false; }
}

async function loadMessages(){
  try{ const r = await apiFetch('/api/messages'); DB.messages = r.messages||[]; }catch(e){ /* بی‌صدا رد شو */ }
}
// نام مجموعه‌های «آرایه‌ای» (لیستی از آیتم‌ها با id یکتا) که ذخیره‌سازی‌شان از این پس
// به‌صورت «تفاوت» (اضافه/ویرایش/حذف) انجام می‌شود، نه رونویسی کل آرایه.
const ARRAY_COLLECTIONS = ['files','customers','mMelk','mSaz','sazBank','cRent','cSale','cMosh','cOther',
  'opportunities','officeCustomers','officeFiles','attendance','activityLogs'];
// آخرین نسخه‌ای از هر مجموعه که با سرور هماهنگ است (بلافاصله پس از بارگذاری یا ذخیره‌ی موفق
// به‌روزرسانی می‌شود) — مبنای محاسبه‌ی «چه چیزی از آخرین‌بار تغییر کرده؟» در saveCollection.
let __syncedSnapshot = {};
let __syncedObjectSnapshot = {}; // برای کلیدهای آبجکتیِ ساده مثل settings و backupMeta
function snapshotCollection(name){
  __syncedSnapshot[name] = new Map((DB[name]||[]).filter(it=>it&&it.id).map(it=>[it.id, JSON.stringify(stripTransientFields(it))]));
}
// فیلدهای موقتِ فقط-کلاینتی (مثل __statusReq که برای مدیریت رقابت درخواست‌های وضعیت
// استفاده می‌شود) نباید نه در محاسبه‌ی تفاوت دخیل باشند و نه هرگز به سرور فرستاده شوند.
function stripTransientFields(item){
  const out = {};
  for(const k in item){ if(!k.startsWith('__')) out[k] = item[k]; }
  return out;
}
async function loadAll(){
  // نکته‌ی مهم: تا زمانی که همه‌ی درخواست‌ها با موفقیت کامل نشوند، هیچ‌کدام از فیلدهای
  // DB دست نمی‌خورَد. اگر یکی از این درخواست‌ها (مثلاً به‌خاطر قطعی موقت اینترنت) شکست
  // بخورد، خطا به بالا (فراخواننده — poll دوره‌ای یا فرآیند ورود) منتقل می‌شود تا آن‌جا
  // به‌جای «همه چیز را خالی نشان بده»، به‌سادگی دوباره تلاش شود؛ داده‌ی محلیِ درست و
  // قبلی هرگز با یک نتیجه‌ی ناقص/خالی رونویسی نمی‌شود.
  let results;
  try{
    results = await Promise.all([
      storageGet(STORAGE_KEYS.files), storageGet(STORAGE_KEYS.customers), storageGet(STORAGE_KEYS.mMelk),
      storageGet(STORAGE_KEYS.mSaz), storageGet(STORAGE_KEYS.sazBank), storageGet(STORAGE_KEYS.cRent),
      storageGet(STORAGE_KEYS.cSale), storageGet(STORAGE_KEYS.cMosh), storageGet(STORAGE_KEYS.cOther),
      storageGet(STORAGE_KEYS.settings), storageGet(STORAGE_KEYS.agentBackup),
      storageGet(STORAGE_KEYS.opportunities), storageGet(STORAGE_KEYS.officeCustomers), storageGet(STORAGE_KEYS.officeFiles),
      storageGet(STORAGE_KEYS.attendance), storageGet(STORAGE_KEYS.activityLogs)
    ]);
  }catch(e){
    console.error('loadAll: دریافت داده از سرور ناموفق بود — داده‌ی محلی دست‌نخورده باقی ماند', e);
    throw e;
  }
  const [files, customers, mMelk, mSaz, sazBank, cRent, cSale, cMosh, cOther, settings, backupMeta, opportunities, officeCustomers, officeFiles, attendance, activityLogs] = results;
  // نکته‌ی دیگر: اگر مجموعه‌ای در همین لحظه تغییرِ محلیِ ذخیره‌نشده دارد (مثلاً به‌خاطر
  // قطعی موقت اینترنت هنوز روی سرور ثبت نشده و در پس‌زمینه در حال تلاش مجدد است)، داده‌ی
  // تازه‌ی سرور — که هنوز این تغییر را ندارد — نباید جایگزین نسخه‌ی محلی شود؛ وگرنه همان
  // تغییرِ در حال ارسال، با رفرشِ این poll برای همیشه از حافظه‌ی مرورگر هم پاک می‌شد.
  const keep = (name, freshValue, transform) => {
    if(__unsavedCollections && __unsavedCollections.has(name)) return; // نسخه‌ی محلی (با تغییر ذخیره‌نشده) دست‌نخورده می‌ماند
    DB[name] = transform ? transform(freshValue) : (freshValue||[]);
  };
  keep('files', files, v=>(v||[]).map(f=>{ if(!f.status) f.status='active'; return f; }));
  keep('customers', customers); keep('mMelk', mMelk); keep('mSaz', mSaz); keep('sazBank', sazBank);
  keep('cRent', cRent); keep('cSale', cSale); keep('cMosh', cMosh); keep('cOther', cOther);
  if(!(__unsavedCollections && __unsavedCollections.has('settings'))) DB.settings=settings||{ conversionRate:2.5, defaultFollowupDays:3 };
  if(!(__unsavedCollections && __unsavedCollections.has('backupMeta'))) DB.backupMeta=backupMeta||{};
  keep('opportunities', opportunities); keep('officeCustomers', officeCustomers);
  keep('officeFiles', officeFiles, v=>(v||[]).map(f=>{ if(!f.status) f.status='active'; return f; }));
  keep('attendance', attendance); keep('activityLogs', activityLogs);
  // مجموعه‌ای که تغییرِ محلیِ ذخیره‌نشده دارد را دوباره «هماهنگ» علامت نزن، وگرنه همان
  // تغییر در محاسبه‌ی تفاوتِ saveCollection دفعه‌ی بعد نادیده گرفته می‌شود.
  ARRAY_COLLECTIONS.forEach(name=>{ if(!__unsavedCollections.has(name)) snapshotCollection(name); });
  if(!__unsavedCollections.has('settings')) __syncedObjectSnapshot.settings = Object.assign({}, DB.settings);
  if(!__unsavedCollections.has('backupMeta')) __syncedObjectSnapshot.backupMeta = Object.assign({}, DB.backupMeta);
  // لیست حساب مشاوران فقط برای مدیر از API اختصاصی خوانده می‌شود

// چند بار (با فاصله‌ی کوتاه) loadAll را امتحان می‌کند تا یک قطعی موقت شبکه هنگام ورود/بارگذاری
// اول برنامه، کاربر را بی‌جهت به صفحه‌ی ورود برنگرداند یا با داده‌ی خالی مواجه نکند.
async function loadAllWithRetry(maxAttempts){
  maxAttempts = maxAttempts || 3;
  let lastErr;
  for(let i=0;i<maxAttempts;i++){
    try{ await loadAll(); return; }
    catch(e){ lastErr=e; if(i<maxAttempts-1) await new Promise(r=>setTimeout(r, 700*(i+1))); }
  }
  throw lastErr;
}
// ادامه‌ی رفع باگ «فایل ثبت‌شده بعد از مدتی پریده بود»: با رفع باگ رقابتِ هم‌زمانی (بالا)
// و رفع باگِ خالی‌شدنِ لیست هنگام خواندن (پایین‌تر، در loadAll)، یک حفره‌ی دیگر باقی
// می‌ماند: اگر خودِ درخواستِ «ذخیره» به‌خاطر قطعی موقت اینترنت یا ری‌استارت لحظه‌ای سرور
// شکست بخورد، پیش‌تر این تابع فقط یک toast کوتاه نشان می‌داد که بلافاصله با toast
// «... ذخیره شد ✓»ی خودِ فراخواننده (که بدون بررسی نتیجه نشان داده می‌شود) پنهان می‌شد —
// کاربر فکر می‌کرد ذخیره شده، در حالی که فقط در حافظه‌ی محلی مرورگرش بود. چند ساعت بعد یا
// بعد از ورود دوباره، همان تغییر واقعاً هرگز روی سرور نبود. راه‌حل: چند تلاش خودکار با
// فاصله‌ی افزایشی، و اگر باز هم ناموفق ماند، یک بنر دائمی (نه toast زودگذر) که تا موفقیتِ
// نهایی روی صفحه می‌ماند و در پس‌زمینه هم مرتب دوباره تلاش می‌کند.
let __unsavedCollections = new Set();
function updateUnsavedBanner(){
  const el = document.getElementById('unsaved-banner');
  if(el) el.classList.toggle('show', __unsavedCollections.size>0);
}
async function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
async function attemptWithRetry(doRequest){
  const delays = [800, 2000, 5000, 10000]; // مجموعاً حدود ۱۸ ثانیه فرصت برای برگشتِ اتصال، قبل از اعلام شکست نهایی
  for(let i=0;i<delays.length;i++){
    try{ await doRequest(); return true; }
    catch(e){
      // اگر علتِ شکست انقضای نشست (۴۰۱) باشد، منتظر ماندن با تاخیرِ فزاینده فایده‌ای ندارد؛
      // apiFetch خودش کاربر را به صفحه‌ی ورود می‌فرستد. تلاش پس‌زمینه (که این تابع را
      // دوباره صدا می‌زند) بعد از ورود دوباره و گرفتن توکن تازه، خودش موفق خواهد شد.
      if(e && e.message==='unauthorized') return false;
      await sleep(delays[i]);
    }
  }
  try{ await doRequest(); return true; }catch(e){ return false; }
}
const __bgRetryTimers = {};
function scheduleBackgroundRetry(name){
  if(__bgRetryTimers[name]) return; // برای هر مجموعه فقط یک تلاشِ پس‌زمینه‌ی فعال کافی است
  __bgRetryTimers[name] = setInterval(async ()=>{
    const ok = await saveCollection(name, true);
    if(ok){
      clearInterval(__bgRetryTimers[name]); delete __bgRetryTimers[name];
      toast('اتصال دوباره برقرار شد — تغییرات ذخیره شد ✓');
      renderApp();
    }
  }, 15000);
}
async function saveCollection(name, isBackgroundRetry){
  if(name==='accounts') return true; // حساب‌ها از مسیر اختصاصی /api/accounts مدیریت می‌شوند، نه اینجا
  const map={ files:STORAGE_KEYS.files, customers:STORAGE_KEYS.customers, mMelk:STORAGE_KEYS.mMelk, mSaz:STORAGE_KEYS.mSaz,
    sazBank:STORAGE_KEYS.sazBank, cRent:STORAGE_KEYS.cRent, cSale:STORAGE_KEYS.cSale, cMosh:STORAGE_KEYS.cMosh,
    cOther:STORAGE_KEYS.cOther, settings:STORAGE_KEYS.settings, backupMeta:STORAGE_KEYS.agentBackup,
    opportunities:STORAGE_KEYS.opportunities, officeCustomers:STORAGE_KEYS.officeCustomers, officeFiles:STORAGE_KEYS.officeFiles,
    attendance:STORAGE_KEYS.attendance, activityLogs:STORAGE_KEYS.activityLogs };
  const key = map[name];
  const onFail = ()=>{
    if(!isBackgroundRetry){
      __unsavedCollections.add(name); updateUnsavedBanner();
      scheduleBackgroundRetry(name);
    }
  };
  const onSuccess = ()=>{ __unsavedCollections.delete(name); updateUnsavedBanner(); };
  if(!ARRAY_COLLECTIONS.includes(name)){
    // تنظیمات و متادیتای بک‌آپ: آبجکت ساده هستند (نه آرایه). به همان دلیل بالا، به‌جای
    // رونویسی کل آبجکت، فقط کلیدهایی که واقعاً تغییر کرده‌اند merge می‌شوند.
    const beforeObj = __syncedObjectSnapshot[name] || {};
    const currentObj = DB[name] || {};
    const patch = {};
    Object.keys(currentObj).forEach(k=>{
      if(JSON.stringify(currentObj[k]) !== JSON.stringify(beforeObj[k])) patch[k] = currentObj[k];
    });
    if(Object.keys(patch).length===0){ onSuccess(); return true; }
    const ok = await attemptWithRetry(()=>apiFetch('/api/storage/'+encodeURIComponent(key)+'/merge', {method:'PATCH', body: JSON.stringify({patch})}));
    if(ok){ __syncedObjectSnapshot[name] = Object.assign({}, currentObj); onSuccess(); return true; }
    console.error('merge save failed after retries', key);
    onFail();
    return false;
  }
  const before = __syncedSnapshot[name] || new Map();
  const current = DB[name] || [];
  const currentIds = new Set();
  const added = [], updated = [];
  current.forEach(item=>{
    if(!item || !item.id) return;
    currentIds.add(item.id);
    const clean = stripTransientFields(item);
    const prevJson = before.get(item.id);
    const nowJson = JSON.stringify(clean);
    if(prevJson===undefined) added.push(clean);
    else if(prevJson!==nowJson) updated.push(clean);
  });
  const removedIds = [];
  before.forEach((_, id)=>{ if(!currentIds.has(id)) removedIds.push(id); });
  if(!added.length && !updated.length && !removedIds.length){ onSuccess(); return true; } // چیزی تغییر نکرده، نیازی به درخواست نیست
  const ok = await attemptWithRetry(()=>apiFetch('/api/storage/'+encodeURIComponent(key)+'/batch', {method:'PATCH', body: JSON.stringify({added, updated, removedIds})}));
  if(ok){ snapshotCollection(name); onSuccess(); return true; }
  console.error('batch save failed after retries', key);
  onFail();
  return false;
}


/* ---------- به‌روزرسانی زنده: هر چند ثانیه یک درخواست سبک می‌فرستیم که فقط می‌گوید
   «چیزی عوض شده یا نه» (بدون دانلود کل داده‌ها، از جمله عکس‌های حجیم قرارداد)؛ فقط
   وقتی واقعاً چیزی تغییر کرده، داده‌ی کامل را می‌گیریم و صفحه را دوباره می‌سازیم.
   این کار هم حجم شبکه‌ی مصرفی را در حالت معمول به شدت کم می‌کند (سریع‌تر و سبک‌تر)
   و هم چون رندر کامل صفحه خیلی کمتر اتفاق می‌افتد، احتمال قطع‌شدن یک کلیک وسط
   بازسازی صفحه (باگ «روی چیزی کلیک می‌شود ولی عمل نمی‌کند») هم خیلی کمتر می‌شود. ---------- */
let __lastMetaSnapshot = '';
let __lastUnreadChat = null; // null یعنی هنوز مقداردهی اولیه نشده (برای جلوگیری از نوتیف اشتباه در اولین ورود)
async function pollForUpdates(){
  if(!SESSION) return;
  if(document.getElementById('overlay-root').classList.contains('show')) return; // وقتی فرمی باز است مزاحم نشو
  if(__statusSaveInFlight>0) return; // وقتی تغییر وضعیت فایل در حال ذخیره است، صبر کن تا رونویسی نشود
  try{
    const meta = await apiFetch('/api/meta');
    const snap = JSON.stringify(meta);
    if(snap===__lastMetaSnapshot) return; // هیچ چیزی عوض نشده — نیازی به دانلود کامل و رندر مجدد نیست
    await loadAll(); // اگر این خط شکست بخورد (throw کند)، اجرا به catch زیر می‌رود و __lastMetaSnapshot
                      // به‌روز نمی‌شود؛ پس در فراخوانی بعدی (۶ ثانیه‌ی دیگر) دوباره تلاش می‌شود، به‌جای
                      // اینکه یک شکست موقت برای همیشه به‌عنوان «هماهنگ» ثبت شود و داده هرگز درست نشود.
    __lastMetaSnapshot = snap; // فقط وقتی داده‌ی کامل واقعاً با موفقیت دانلود شد، این را «هماهنگ» علامت بزن
    const newUnread = unreadChatCount();
    if(__lastUnreadChat!==null && newUnread>__lastUnreadChat){
      toast('📩 پیام جدید در گفتگو دریافت شد');
    }
    __lastUnreadChat = newUnread;
    renderApp();
  }catch(e){ /* بی‌صدا رد شو، دفعه بعد دوباره تلاش می‌کند */ }
}
setInterval(pollForUpdates, 6000);

/* ---------- محاسبه‌ی خودکار کمیسیون قرارداد ----------
   رهن و اجاره: (هر ۱,۰۰۰,۰۰۰ تومان رهن → ۱۵,۰۰۰ تومان) + (یک‌سوم اجاره ماهیانه) → ×۱.۱۰ (۱۰٪ ارزش‌افزوده) = سهم یک طرف
   خرید و فروش: ۰.۵٪ قیمت کل برای هر طرف → ×۱.۱۰ (۱۰٪ ارزش‌افزوده) = سهم هر طرف
   در هر دو حالت، عدد نهاییِ «کل» که در قرارداد ذخیره می‌شود، مجموع سهم هر دو طرف است. */
function computeContractCommission(kind, d){
  if(kind==='rent'){
    const rahn = Number(d.rahnPrice||0), ejare = Number(d.ejarePrice||0);
    const oneSideBase = (rahn/1000000*15000) + (ejare/3);
    const oneSide = oneSideBase * 1.10;
    return { oneSide: Math.round(oneSide), total: Math.round(oneSide*2) };
  }
  if(kind==='sale'){
    const total = Number(d.totalPrice||0);
    const sellerShare = total*0.005*1.10;
    const buyerShare = total*0.005*1.10;
    return { sellerShare: Math.round(sellerShare), buyerShare: Math.round(buyerShare), total: Math.round(sellerShare+buyerShare) };
  }
  return null;
}
// سهم هر مشاور از کمیسیون یک قرارداد؛ سازگار با قراردادهای قدیمی (فقط agentName/agentSharePercent)
// و قراردادهای جدید که چند مشاور دارند (agentShares: [{name, percent}, ...]).
function contractAgentShares(item){
  const total = Number(item.commissionTotal||0);
  const list = (Array.isArray(item.agentShares) && item.agentShares.length)
    ? item.agentShares
    : [{ name:item.agentName||'', percent:Number(item.agentSharePercent||0) }];
  return list.map(a=>({ name:a.name || item.agentName || '-', percent:Number(a.percent||0), amount:Math.round(total*Number(a.percent||0)/100) }));
}
function contractAgentShareTotal(item){
  return contractAgentShares(item).reduce((s,a)=>s+a.amount,0);
}
// سهم مشخصِ یک مشاورِ خاص (با نام) از یک قرارداد — برای گزارش‌های مخصوصِ همان مشاور
function agentShareAmountFor(item, agentName){
  const found = contractAgentShares(item).find(a=>a.name===agentName);
  return found ? found.amount : 0;
}

let __formState=null, __formFields=null, __formOnSave=null;

function inputHtml(f, val){
  const v = val===undefined||val===null? '' : val;
  if(f.type==='section') return `<div class="section-label">${esc(f.label)}</div>`;
  if(f.type==='computed') return `<div class="field ${f.span==='full'?'full':''}"><label>${esc(f.label)}</label><input data-computed="${f.key}" type="text" value="${esc(v)}" disabled style="background:var(--paper);font-weight:700;color:var(--ink)"></div>`;
  if(f.type==='checkbox') return `<div class="field ${f.span==='full'?'full':''}"><label>&nbsp;</label><div class="check-row"><input type="checkbox" data-key="${f.key}" id="chk_${f.key}" ${v?'checked':''}><label for="chk_${f.key}" style="margin:0">${esc(f.label)}</label></div></div>`;
  if(f.type==='select'){
    const opts = (f.options||[]).map(o=>`<option value="${esc(o)}" ${v===o?'selected':''}>${esc(o)}</option>`).join('');
    return `<div class="field ${f.span==='full'?'full':''}"><label>${esc(f.label)}</label><select data-key="${f.key}"><option value="">- انتخاب کنید -</option>${opts}</select></div>`;
  }
  if(f.type==='textarea') return `<div class="field ${f.span==='full'?'full':''}"><label>${esc(f.label)}</label><textarea data-key="${f.key}" rows="3">${esc(v)}</textarea></div>`;
  if(f.price){
    const shown = (v!==''&&v!==undefined&&v!==null) ? toFa(v) : '';
    return `<div class="field ${f.span==='full'?'full':''}"><label>${esc(f.label)}${f.required?' *':''}</label><input data-key="${f.key}" data-price="1" type="text" inputmode="numeric" placeholder="مثال: 9,600,000" value="${esc(shown)}"><div class="price-live" data-live="${f.key}" style="font-size:11px;color:var(--gold);margin-top:5px;line-height:1.7;min-height:14px"></div></div>`;
  }
  if(f.type==='date'){
    const iso = v || '';
    const shown = iso? isoToJalaliDisplay(iso) : '';
    return `<div class="field ${f.span==='full'?'full':''}"><label>${esc(f.label)}${f.required?' *':''}</label>
      <div class="jalali-date-field">
        <input data-key="${f.key}" data-jalali="1" data-iso="${esc(iso)}" type="text" readonly placeholder="انتخاب تاریخ" value="${esc(shown)}" onclick="openJalaliPicker(this)">
        <span class="jf-ic">📅</span>
      </div>
    </div>`;
  }
  const type = f.type==='number'?'number':(f.type==='tel'?'tel':(f.type==='time'?'time':'text'));
  return `<div class="field ${f.span==='full'?'full':''}"><label>${esc(f.label)}${f.required?' *':''}</label><input data-key="${f.key}" type="${type}" value="${esc(v)}"></div>`;
}

function recomputeForm(){
  const d = __formState;
  // قیمت هر متر
  if('pricePerMeter' in d || __formFields.some(f=>f.key==='pricePerMeter')){
    const area = Number(d.propType==='garden' ? (d.totalArea||d.buildingArea||0) : (d.area||d.buildingArea||0));
    const total = Number(d.totalPrice||0);
    d.pricePerMeter = area>0 ? Math.round(total/area) : 0;
  }
  // محاسبه‌ی خودکار کمیسیون قرارداد (رهن/اجاره یا خرید/فروش) — مگر این‌که ورود دستی فعال باشد
  if(__formFields.some(f=>f.key==='commissionTotal') && (d.__kind==='rent' || d.__kind==='sale')){
    if(d.manualCommission){
      d.commissionTotal = Number(d.commissionManualValue||0);
    } else {
      const calc = computeContractCommission(d.__kind, d);
      d.commissionTotal = calc ? calc.total : 0;
    }
    const hintEl = document.getElementById('commission-hint');
    if(hintEl){
      const calc = computeContractCommission(d.__kind, d);
      if(!calc){ hintEl.textContent=''; }
      else if(d.__kind==='rent'){
        hintEl.textContent = d.manualCommission
          ? `محاسبه‌ی خودکار (فقط جهت مقایسه): یک طرف ${toFa(calc.oneSide)} تومان — هر دو طرف ${toFa(calc.total)} تومان`
          : `این مبلغ برای «هر دو طرف» (مالک + مستاجر) است، شامل ۱۰٪ ارزش‌افزوده. سهم یک طرف: ${toFa(calc.oneSide)} تومان.`;
      } else {
        hintEl.textContent = d.manualCommission
          ? `محاسبه‌ی خودکار (فقط جهت مقایسه): فروشنده ${toFa(calc.sellerShare)} — خریدار ${toFa(calc.buyerShare)} — جمع ${toFa(calc.total)} تومان`
          : `شامل ۱۰٪ ارزش‌افزوده — سهم فروشنده: ${toFa(calc.sellerShare)} تومان، سهم خریدار: ${toFa(calc.buyerShare)} تومان.`;
      }
    }
  }
  document.querySelectorAll('[data-computed]').forEach(el=>{
    const k=el.getAttribute('data-computed');
    el.value = d[k]!==undefined ? toFa(d[k])+(k==='pricePerMeter'?' تومان':'') : '';
  });
  // پیش‌نمایش زنده‌ی مبلغ به تومان و حروف
  document.querySelectorAll('[data-live]').forEach(el=>{
    const k = el.getAttribute('data-live');
    const val = d[k];
    el.textContent = (val!==undefined && val!=='' && val!==null && !isNaN(Number(val))) ? (toFa(val)+' تومان — '+numberToWordsFa(val)) : '';
  });
  // نمایش/مخفی‌سازی showIf
  __formFields.forEach(f=>{
    if(f.showIf){
      const wrap = document.querySelector(`[data-key="${f.key}"]`);
      if(wrap){
        const container = wrap.closest('.field');
        if(container) container.style.display = f.showIf(d) ? '' : 'none';
      }
    }
  });
}

function openFormModal(title, fields, initialData, onSave, extraHtml){
  closeJalaliPicker();
  __formFields = fields; __formState = Object.assign({}, initialData||{}); __formOnSave = onSave;
  const root = document.getElementById('overlay-root');
  const body = fields.map(f=>inputHtml(f, __formState[f.key])).join('');
  root.innerHTML = `
    <div class="modal">
      <h3>${esc(title)}</h3>
      <div class="form-grid" id="dynamic-form">${body}</div>
      ${extraHtml||''}
      <div class="modal-actions">
        <button class="btn btn-outline" id="modal-cancel">انصراف</button>
        <button class="btn btn-primary" id="modal-save">ذخیره</button>
      </div>
    </div>`;
  root.classList.add('show');
  const formEl = document.getElementById('dynamic-form');
  formEl.addEventListener('input', (e)=>{
    const key = e.target.getAttribute('data-key');
    if(!key) return;
    if(e.target.hasAttribute('data-price')){
      const digits = e.target.value.replace(/[^\d]/g,'');
      __formState[key] = digits===''? '': Number(digits);
      const formatted = digits===''? '' : Number(digits).toLocaleString('en-US');
      if(e.target.value !== formatted) e.target.value = formatted;
    }
    else if(e.target.type==='checkbox') __formState[key]=e.target.checked;
    else if(e.target.type==='number') __formState[key]= e.target.value===''? '': Number(e.target.value);
    else __formState[key]=e.target.value;
    recomputeForm();
  });
  formEl.addEventListener('change', (e)=>{
    const key = e.target.getAttribute('data-key');
    if(!key) return;
    if(e.target.tagName==='SELECT') __formState[key]=e.target.value;
  });
  recomputeForm();
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save').onclick = ()=>{
    for(const f of fields){
      if(f.required && (f.showIf? f.showIf(__formState): true) && !__formState[f.key] && __formState[f.key]!==0){
        toast(`فیلد «${f.label}» را پر کنید`); return;
      }
    }
    onSave(__formState);
    closeModal();
  };
}
function closeModal(){
  closeJalaliPicker();
  document.getElementById('overlay-root').classList.remove('show');
  document.getElementById('overlay-root').innerHTML='';
}

function refocusAfterRender(elementId){
  renderApp();
  const el = document.getElementById(elementId);
  if(el){
    el.focus();
    const len = el.value.length;
    try{ el.setSelectionRange(len, len); }catch(e){} // برای input[type=number] این متد پشتیبانی نمی‌شود، خطا را نادیده می‌گیریم
  }
}

function applySearchSortFilter(list, scopeKey, searchFields, priceFn){
  let arr = list.slice();
  const q = (UI.search[scopeKey]||'').trim().toLowerCase();
  if(q) arr = arr.filter(it=> searchFields.some(f=> String(it[f]||'').toLowerCase().includes(q)));
  const min = Number(UI.priceMin[scopeKey]||0), max = Number(UI.priceMax[scopeKey]||0);
  if(min) arr = arr.filter(it=> priceFn(it) >= min);
  if(max) arr = arr.filter(it=> priceFn(it) <= max);
  const sort = UI.sort[scopeKey];
  if(sort==='price_desc') arr.sort((a,b)=>priceFn(b)-priceFn(a));
  else if(sort==='price_asc') arr.sort((a,b)=>priceFn(a)-priceFn(b));
  else if(sort==='newest') arr.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  else arr.sort((a,b)=> new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt));
  return arr;
}

function addFile(dealType, propType){
  openFormModal('فایل جدید — '+(dealType==='sale'?'فروش':'رهن و اجاره')+' / '+propTypeLabel(propType),
    fileFields(dealType, propType), {propType}, async (data)=>{
      data.id=uid(); data.dealType=dealType; data.propType=propType; data.agentName=SESSION.name;
      data.status = 'active';
      data.createdAt=nowIso(); data.updatedAt=nowIso();
      if(dealType==='sale'){
        const area = Number(propType==='garden' ? (data.totalArea||data.buildingArea||0) : (data.area||data.buildingArea||0));
        data.pricePerMeter = area>0? Math.round(Number(data.totalPrice||0)/area):0;
      }
      DB.files.push(data); await saveCollection('files'); toast('فایل ذخیره شد ✓'); renderApp();
    });
}
function editFile(id){
  const item = DB.files.find(f=>f.id===id); if(!item) return;
  openFormModal('ویرایش فایل', fileFields(item.dealType, item.propType), item, async (data)=>{
    if(item.dealType==='sale'){
      const area = Number(item.propType==='garden' ? (data.totalArea||data.buildingArea||0) : (data.area||data.buildingArea||0));
      data.pricePerMeter = area>0? Math.round(Number(data.totalPrice||0)/area):0;
    }
    Object.assign(item, data); item.updatedAt=nowIso();
    await saveCollection('files'); toast('تغییرات ذخیره شد ✓'); renderApp();
  });
}
async function deleteFile(id){
  if(!confirm('این فایل حذف شود؟')) return;
  DB.files = DB.files.filter(f=>f.id!==id); await saveCollection('files'); toast('فایل حذف شد'); renderApp();
}

const CONTRACT_MAP = { rent:{coll:'cRent', label:'اجاره'}, sale:{coll:'cSale', label:'فروش'}, mosharekat:{coll:'cMosh', label:'مشارکت در ساخت'}, other:{coll:'cOther', label:'املاک دیگر'} };

function resizeImageFile(file, maxW){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function openContractModal(kind, existing){
  const meta = CONTRACT_MAP[kind];
  const data = existing? Object.assign({}, existing) : {
    renewalAlarmDays: kind==='rent'||kind==='other'?30:undefined,
  };
  data.__kind = kind;
  // برای قراردادهای قدیمیِ از قبل ثبت‌شده که کمیسیون‌شان دستی وارد شده بود، پیش‌فرض را
  // «دستی» می‌گذاریم تا با باز کردن فرم، عدد قبلی‌شان به‌طور ناگهانی با فرمول جدید عوض نشود.
  if(existing){
    if(data.manualCommission===undefined) data.manualCommission = !!existing.commissionTotal;
    data.commissionManualValue = existing.commissionTotal;
  }
  const photos = (data.photos||[]).slice();
  const showAgentShares = kind==='rent' || kind==='sale';
  const agentRoster = agentRosterForPerformance();
  let agentShares = (Array.isArray(data.agentShares) && data.agentShares.length)
    ? data.agentShares.map(a=>({ name:a.name||'', percent:Number(a.percent||0) }))
    : [{ name: data.agentName || '', percent: existing? Number(data.agentSharePercent||40) : 40 }];
  const extraHtml = `
    ${showAgentShares? `
    <div class="section-label" style="margin-top:14px">🧾 تقسیم کمیسیون بین مشاوران</div>
    <div id="commission-hint" class="cc-note" style="margin-bottom:10px"></div>
    <div id="agent-shares-rows"></div>
    <button type="button" class="btn btn-outline btn-sm" id="agent-shares-add" style="margin-top:2px">+ افزودن مشاور</button>
    <div id="agent-shares-total" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
    ` : ''}
    <div class="section-label" style="margin-top:14px">پیوست عکس قرارداد</div>
    <div class="upload-box" id="contract-upload-box">📎 برای افزودن عکس قرارداد کلیک کنید</div>
    <input type="file" id="contract-file-input" accept="image/*" multiple style="display:none">
    <div class="photo-row" id="contract-photo-row"></div>`;
  openFormModal((existing?'ویرایش':'ثبت')+' قرارداد '+meta.label, contractFields(kind, data.agentName), data, async (formData)=>{
    formData.photos = photos;
    if(showAgentShares){
      const cleaned = agentShares.filter(a=>a.name && a.name.trim());
      // formData.agentName الزامی است و همیشه از انتخاب بالای فرم پر شده؛ اگر به هر دلیلی
      // ردیف‌های تقسیم کمیسیون خالی مانده باشند، مشاورِ همان فیلد بالا با سهم ۴۰٪ (و ۶۰٪
      // باقی‌مانده برای دفتر) به‌عنوان تنها سهم در نظر گرفته می‌شود.
      formData.agentShares = cleaned.length? cleaned : [{name: formData.agentName, percent:40}];
      formData.agentSharePercent = formData.agentShares[0].percent;
    }
    delete formData.commissionManualValue; // فقط برای فرم لازم بود؛ عدد نهایی در commissionTotal ذخیره شده
    if(existing){
      Object.assign(existing, formData); existing.updatedAt=nowIso();
    } else {
      formData.id=uid(); formData.agentName = formData.agentName||SESSION.name; formData.createdAt=nowIso(); formData.updatedAt=nowIso();
      DB[meta.coll].push(formData);
    }
    await saveCollection(meta.coll); toast('قرارداد ذخیره شد ✓'); renderApp();
  }, extraHtml);

  function renderAgentShareRows(){
    const wrap = document.getElementById('agent-shares-rows');
    if(!wrap) return;
    wrap.innerHTML = agentShares.map((a,i)=>`
      <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">
        ${i===0
          ? `<div style="flex:2;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13.5px;background:var(--paper);color:${a.name?'var(--ink)':'var(--danger)'}">${esc(a.name||'ابتدا «مشاور مربوطه» را از بالا انتخاب کنید')}</div>`
          : `<select data-ash-name="${i}" style="flex:2;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-family:inherit;font-size:13.5px">
               <option value="">- انتخاب مشاور -</option>
               ${agentRoster.map(n=>`<option value="${esc(n)}" ${a.name===n?'selected':''}>${esc(n)}</option>`).join('')}
             </select>`}
        <input type="number" placeholder="سهم ٪" value="${a.percent||''}" data-ash-percent="${i}" style="flex:1;max-width:84px;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-family:inherit;font-size:13.5px">
        ${(agentShares.length>1 && i>0)? `<button type="button" class="btn btn-outline btn-sm" data-ash-remove="${i}">✕</button>`:''}
      </div>`).join('');
    const totalPct = agentShares.reduce((s,a)=>s+Number(a.percent||0),0);
    const totalEl = document.getElementById('agent-shares-total');
    if(totalEl) totalEl.innerHTML = `جمع سهم مشاوران: <b>${totalPct}٪</b> — باقی‌مانده برای دفتر: <b>${Math.max(0,100-totalPct)}٪</b>` + (totalPct>100? ' — <span style="color:var(--danger)">⚠️ جمع سهم‌ها بیشتر از ۱۰۰٪ شده است</span>':'');
    wrap.querySelectorAll('[data-ash-name]').forEach(el=> el.onchange = ()=>{ agentShares[+el.getAttribute('data-ash-name')].name = el.value; });
    wrap.querySelectorAll('[data-ash-percent]').forEach(el=> el.oninput = ()=>{ agentShares[+el.getAttribute('data-ash-percent')].percent = Number(el.value||0); renderAgentShareRows(); });
    wrap.querySelectorAll('[data-ash-remove]').forEach(el=> el.onclick = ()=>{ agentShares.splice(+el.getAttribute('data-ash-remove'),1); renderAgentShareRows(); });
  }
  function renderPhotoRow(){
    const row = document.getElementById('contract-photo-row');
    if(!row) return;
    row.innerHTML = photos.map((p,i)=>`<div class="ph"><img src="${p}" onclick="window.__viewContractPhoto(${i})"><button onclick="event.stopPropagation();window.__removeContractPhoto(${i})">×</button></div>`).join('');
  }
  function removePhotoInline(i){ photos.splice(i,1); renderPhotoRow(); }
  window.__removeContractPhoto = removePhotoInline;
  window.__viewContractPhoto = (i)=>{ const w=window.open(); if(w) w.document.write('<img src="'+photos[i]+'" style="max-width:100%">'); };
  setTimeout(()=>{
    renderPhotoRow();
    if(showAgentShares){
      renderAgentShareRows();
      const addBtn = document.getElementById('agent-shares-add');
      if(addBtn) addBtn.onclick = ()=>{ agentShares.push({name:'', percent:0}); renderAgentShareRows(); };
      // نفر اول لیست تقسیم کمیسیون همیشه باید همان «مشاور مربوطه»ی انتخاب‌شده در بالای فرم
      // باشد، نه چیزی دیگر (رفع باگ: قبلاً این کادر به‌طور پیش‌فرض نام مدیر دفتر بود).
      const mainAgentSelect = document.querySelector('#dynamic-form [data-key="agentName"]');
      if(mainAgentSelect){
        mainAgentSelect.addEventListener('change', ()=>{
          if(agentShares.length) agentShares[0].name = mainAgentSelect.value;
          renderAgentShareRows();
        });
      }
    }
    const box = document.getElementById('contract-upload-box');
    const inp = document.getElementById('contract-file-input');
    if(box) box.onclick = ()=> inp.click();
    if(inp) inp.onchange = async ()=>{
      for(const file of inp.files){
        const dataUrl = await resizeImageFile(file, 900);
        photos.push(dataUrl);
      }
      renderPhotoRow();
      inp.value='';
    };
  }, 0);
}
