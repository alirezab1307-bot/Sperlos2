<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>اسپرلوس | مدیریت املاک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#152238;
  --navy-2:#1E3350;
  --navy-3:#26405F;
  --paper:#F4F1E9;
  --paper-2:#FFFFFF;
  --gold:#B08D4F;
  --gold-2:#D8B876;
  --on-gold:#152238;
  --badge-gold-bg:#FBF2E1;
  --badge-gold-text:#8A6A26;
  --emerald:#2F6F55;
  --emerald-2:#3E8B6C;
  --ink:#1B2230;
  --muted:#6B7280;
  --line:#E4DFD1;
  --danger:#B0473F;
  --danger-bg:#FBECEA;
  --ok-bg:#EAF3EC;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}
/* تم ۱ — روشن گرم (پیش‌فرض): کرم ملایم + سرمه‌ای + طلایی */
html[data-theme="light-warm"]{
  --navy:#152238; --navy-2:#1E3350; --navy-3:#26405F;
  --paper:#F4F1E9; --paper-2:#FFFFFF;
  --gold:#B08D4F; --gold-2:#D8B876; --on-gold:#152238;
  --badge-gold-bg:#FBF2E1; --badge-gold-text:#8A6A26;
  --emerald:#2F6F55; --emerald-2:#3E8B6C;
  --ink:#1B2230; --muted:#6B7280; --line:#E4DFD1;
  --danger:#B0473F; --danger-bg:#FBECEA; --ok-bg:#EAF3EC;
}
/* تم ۲ — روشن خنک: پس‌زمینه‌ی آبی‌خاکستری ملایم */
html[data-theme="light-cool"]{
  --navy:#1E3A5F; --navy-2:#28466E; --navy-3:#32557F;
  --paper:#EDF1F5; --paper-2:#FFFFFF;
  --gold:#1E5A82; --gold-2:#2E6DA4; --on-gold:#FFFFFF;
  --badge-gold-bg:#E3EEF5; --badge-gold-text:#1E5A82;
  --emerald:#2C7D6B; --emerald-2:#3C9683;
  --ink:#1B2635; --muted:#5C6B7A; --line:#D7E0E7;
  --danger:#B0473F; --danger-bg:#FBECEA; --ok-bg:#E7F2EF;
}
/* تم ۳ — روشن طبیعی: سبز مریمی ملایم، آرام و کم‌خستگی برای چشم */
html[data-theme="light-sage"]{
  --navy:#22392E; --navy-2:#2C463A; --navy-3:#355544;
  --paper:#F1F4EE; --paper-2:#FFFFFF;
  --gold:#8A6D3B; --gold-2:#A6863F; --on-gold:#FFFFFF;
  --badge-gold-bg:#F1E9D8; --badge-gold-text:#6B5429;
  --emerald:#3F7D5C; --emerald-2:#4F9370;
  --ink:#1E2A22; --muted:#66756B; --line:#DCE3D8;
  --danger:#B0473F; --danger-bg:#FBECEA; --ok-bg:#E7F0E9;
}
/* تم ۴ — تیره طلایی: هم‌راستا با آرم اسپرلوس (زغالی گرم + طلایی)، مناسب محیط کم‌نور */
html[data-theme="dark-gold"]{
  --navy:#121214; --navy-2:#1A1A1D; --navy-3:#222225;
  --paper:#121214; --paper-2:#1C1C20;
  --gold:#C9A227; --gold-2:#E4C767; --on-gold:#121214;
  --badge-gold-bg:#2E2812; --badge-gold-text:#E4C767;
  --emerald:#3E8B6C; --emerald-2:#4FA381;
  --ink:#EDE7D8; --muted:#9C9690; --line:#2C2C31;
  --danger:#E27367; --danger-bg:#3A2320; --ok-bg:#1F3129;
}
/* تم ۵ — تیره ملایم: خاکستری تیره (نه مشکی خالص)، برای استفاده‌ی طولانی‌مدت راحت‌تر برای چشم */
html[data-theme="dark-soft"]{
  --navy:#2B2E33; --navy-2:#33373D; --navy-3:#3C4046;
  --paper:#22252A; --paper-2:#2A2D33;
  --gold:#C7A76B; --gold-2:#D9BE8B; --on-gold:#2B2E33;
  --badge-gold-bg:#332C22; --badge-gold-text:#D9BE8B;
  --emerald:#5FA98A; --emerald-2:#6FB89A;
  --ink:#E6E3DD; --muted:#9BA0A6; --line:#3A3E44;
  --danger:#D98B80; --danger-bg:#3A2A28; --ok-bg:#25332C;
}
/* تم ۶ — تیره سرمه‌ای: آبی تیره خنک، جایگزین سردتر برای دو تم تیره‌ی گرم بالا */
html[data-theme="dark-navy"]{
  --navy:#12202E; --navy-2:#1A2C3D; --navy-3:#22394C;
  --paper:#16232F; --paper-2:#1E2E3D;
  --gold:#5FA8D3; --gold-2:#7FC0E8; --on-gold:#12202E;
  --badge-gold-bg:#1C2E3D; --badge-gold-text:#7FC0E8;
  --emerald:#4FA88A; --emerald-2:#5FBF9C;
  --ink:#E3EAF0; --muted:#93A3B0; --line:#2C3D4C;
  --danger:#E2867A; --danger-bg:#332427; --ok-bg:#1E3230;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Vazirmatn',Tahoma,Arial,sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  padding-top:var(--safe-top);
  padding-bottom:var(--safe-bottom);
  padding-left:var(--safe-left);
  padding-right:var(--safe-right);
}
button,input,select,textarea{font-family:'Vazirmatn',Tahoma,Arial,sans-serif;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#cbbf9f;border-radius:8px;}

/* ---------- Login ---------- */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  padding:24px;
}
.login-card{
  background:var(--paper-2);border-radius:20px;padding:36px 30px;width:100%;max-width:420px;
  box-shadow:0 30px 60px rgba(0,0,0,.35);
  border-top:5px solid var(--gold);
}
.brand{
  text-align:center;margin-bottom:22px;
}
.brand .mark{
  width:64px;height:64px;border-radius:16px;margin:0 auto 12px;
  background:linear-gradient(135deg,var(--gold),var(--gold-2));
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;color:var(--navy);
}
.brand h1{font-size:22px;margin:0;font-weight:800;color:var(--navy);}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px;letter-spacing:.5px;}
.role-tabs{display:flex;gap:8px;margin-bottom:18px;background:var(--paper);border-radius:12px;padding:4px;}
.role-tab{flex:1;text-align:center;padding:10px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px;transition:.15s;}
.role-tab.active{background:var(--navy);color:#fff;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);font-size:14px;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,79,.15);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:14px;transition:.15s;
}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-2);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--on-gold);}
.btn-emerald{background:var(--emerald);color:#fff;}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--navy);}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-block{width:100%;}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px;}
.hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center;line-height:1.7;}

/* ---------- App shell ---------- */
#app-screen{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:250px;flex-shrink:0;background:var(--navy);color:#EDE7D8;
  display:flex;flex-direction:column;padding:18px 14px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar .brand-mini{display:flex;align-items:center;gap:10px;padding:6px 6px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px;}
.sidebar .brand-mini .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-2));display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--on-gold);font-size:16px;}
.sidebar .brand-mini div b{display:block;font-size:14px;}
.sidebar .brand-mini div span{font-size:11px;opacity:.65;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;
  font-size:13.5px;color:#CBD3DE;margin-bottom:3px;font-weight:600;transition:.15s;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--gold);color:var(--on-gold);}
.nav-item .ic{width:18px;text-align:center;}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);}
.user-chip{display:flex;align-items:center;gap:8px;padding:8px;font-size:12.5px;color:#cbd3de;}
.user-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--emerald-2);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(244,241,233,.9);backdrop-filter:blur(6px);
  padding:14px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.topbar h2{margin:0;font-size:17px;font-weight:800;color:var(--ink);}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.hamburger{display:none;background:var(--navy);color:#fff;border:none;border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;}
.content{padding:20px 22px 90px;flex:1;}

.mobile-tabbar{display:none;}

/* ---------- Cards / lists ---------- */
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.tab-btn{
  padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper-2);cursor:pointer;
  font-weight:700;font-size:13px;color:var(--muted);
}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;background:var(--paper-2);padding:12px;border-radius:14px;border:1px solid var(--line);}
.toolbar input[type=text],.toolbar select,.toolbar input[type=number]{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:var(--paper);}
.toolbar .grow{flex:1;min-width:160px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.card{
  background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;
  box-shadow:0 2px 10px rgba(21,34,56,.03);
}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.card-title{font-weight:800;font-size:15px;color:var(--ink);}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:700;}
.badge-gold{background:var(--badge-gold-bg);color:var(--badge-gold-text);}
.badge-emerald{background:var(--ok-bg);color:var(--emerald);}
.badge-navy{background:#E9EEF5;color:var(--navy);}
.badge-danger{background:var(--danger-bg);color:var(--danger);}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12.5px;margin:10px 0;}
.kv div span{display:block;}
.kv .k{color:var(--muted);font-size:11px;}
.kv .v{font-weight:700;color:var(--ink);}
.price-box{background:var(--paper);border-radius:10px;padding:10px 12px;margin:10px 0;border:1px dashed var(--line);}
.price-box .main-price{font-weight:800;color:var(--ink);font-size:15px;}
.price-box .words{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6;}
.desc-box{font-size:12.5px;color:var(--ink);background:var(--paper);border-radius:10px;padding:10px;margin:8px 0;line-height:1.8;}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.phone-link{color:var(--emerald);font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
.phone-link:hover{text-decoration:underline;}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .ic{font-size:40px;margin-bottom:10px;}
.meta-line{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;}

/* Modal / form */
.overlay{position:fixed;inset:0;background:rgba(21,20,15,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:24px 14px;overflow-y:auto;}
.overlay.show{display:flex;}
.modal{background:var(--paper-2);border-radius:18px;max-width:640px;width:100%;padding:22px;margin-top:20px;}
.modal h3{margin:0 0 16px;color:var(--ink);font-size:17px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.form-grid .full{grid-column:1/-1;}
.section-label{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--gold);margin:6px 0 -2px;text-transform:uppercase;letter-spacing:.5px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;border-top:1px solid var(--line);padding-top:16px;}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:12px 22px;border-radius:999px;font-size:13px;font-weight:700;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;bottom:34px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px;}
.stat-card{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:16px;}
.stat-card .n{font-size:24px;font-weight:800;color:var(--ink);}
.stat-card .l{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600;}
.alarm-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.alarm-item.urgent{border-color:var(--danger);background:var(--danger-bg);}
.section-title{font-size:15px;font-weight:800;color:var(--ink);margin:22px 0 12px;display:flex;align-items:center;gap:8px;}
.table-wrap{overflow-x:auto;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:700px;}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:var(--paper);color:var(--muted);font-weight:700;font-size:11.5px;}
tr:last-child td{border-bottom:none;}
.img-thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;}
.upload-box{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;font-size:12.5px;color:var(--muted);}
.upload-box:hover{border-color:var(--gold);}
.photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.photo-row .ph{position:relative;}
.photo-row .ph img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
.photo-row .ph button{position:absolute;top:-6px;left:-6px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;line-height:1;}

@media (max-width:880px){
  .sidebar{position:fixed;right:0;top:0;height:100vh;transform:translateX(102%);transition:.25s;z-index:60;box-shadow:-10px 0 30px rgba(0,0,0,.3);}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:block;}
  .content{padding:16px 14px 100px;}
  .topbar{padding:12px 14px;}
  .form-grid{grid-template-columns:1fr;}
  .kv{grid-template-columns:1fr 1fr;}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;}
  .sidebar-backdrop.show{display:block;}
}
</style>
</head>
<body>

<div id="login-screen"></div>
<div id="app-screen"></div>
<div id="overlay-root" class="overlay"></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================================
   اسپرلوس - مدیریت املاک

/* ---------- عدد به حروف فارسی ---------- */
function numberToWordsFa(num){
  num = Math.round(Number(num||0));
  if(num===0) return 'صفر تومان';
  const ones=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];
  const teens=['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
  const tens=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
  const hundreds=['','یکصد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
  const scales=['',' هزار',' میلیون',' میلیارد',' هزار میلیارد',' میلیون میلیارد'];
  function threeDigit(n){
    let parts=[];
    const h=Math.floor(n/100), t=n%100;
    if(h) parts.push(hundreds[h]);
    if(t>=10 && t<20) parts.push(teens[t-10]);
    else{
      const tt=Math.floor(t/10), o=t%10;
      if(tt) parts.push(tens[tt]);
      if(o) parts.push(ones[o]);
    }
    return parts.join(' و ');
  }
  let neg = num<0; num=Math.abs(num);
  let groups=[]; let n=num;
  if(n===0) groups=[0];
  while(n>0){ groups.unshift(n%1000); n=Math.floor(n/1000); }
  let words=[];
  const total=groups.length;
  groups.forEach((g,i)=>{
    if(g===0) return;
    const scaleIdx = total-1-i;
    words.push(threeDigit(g)+(scales[scaleIdx]||''));
  });
  return (neg?'منفی ':'')+words.join(' و ')+' تومان';
}

/* ---------- شباهت قیمت ---------- */
function priceSimilarity(a,b){
  a=Number(a||0); b=Number(b||0);
  if(a===0 && b===0) return 1;
  if(a===0 || b===0) return 0;
  return 1 - Math.abs(a-b)/Math.max(a,b);
}

/* ---------- Toast ---------- */
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ---------- کپی مشخصات ---------- */
function copyText(text){
  navigator.clipboard.writeText(text).then(()=>toast('در کلیپ‌بورد کپی شد ✓')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('در کلیپ‌بورد کپی شد ✓'); }catch(e){ toast('کپی ناموفق بود'); }
    document.body.removeChild(ta);
  });
}

/* ---------- Storage layer: اتصال به بک‌اند واقعی ---------- */
const API_BASE = ''; // چون سرور خودش همین فایل را هم سرو می‌کند، آدرس نسبی کافی است
let TOKEN = localStorage.getItem('sl_token') || null;

async function apiFetch(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(TOKEN) headers['Authorization'] = 'Bearer '+TOKEN;
  let res;
  try{
    res = await fetch(API_BASE+path, Object.assign({}, opts, {headers}));
  }catch(e){
    toast('اتصال به سرور برقرار نشد. اینترنت یا آدرس سرور را بررسی کنید.');
    throw e;
  }
  if(res.status===401){
    TOKEN=null; localStorage.removeItem('sl_token'); SESSION=null;
    renderLogin();
    throw new Error('unauthorized');
  }
  let body=null;
  try{ body = await res.json(); }catch(e){}
  if(!res.ok){
    const err = new Error((body&&body.error)||'request_failed');
    err.body = body;
    throw err;
  }
  return body;
}

async function storageGet(key){
  try{
    const r = await apiFetch('/api/storage/'+encodeURIComponent(key));
    return (r && r.value!==null && r.value!==undefined) ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    await apiFetch('/api/storage/'+encodeURIComponent(key), {method:'PUT', body: JSON.stringify({value: JSON.stringify(value)})});
    return true;
  }catch(e){ console.error('storage set failed', key, e); toast('خطا در ذخیره‌سازی روی سرور'); return false; }
}

async function loadAll(){
  const [files, customers, mMelk, mSaz, sazBank, cRent, cSale, cMosh, cOther, settings, backupMeta, opportunities, officeCustomers] = await Promise.all([
    storageGet(STORAGE_KEYS.files), storageGet(STORAGE_KEYS.customers), storageGet(STORAGE_KEYS.mMelk),
    storageGet(STORAGE_KEYS.mSaz), storageGet(STORAGE_KEYS.sazBank), storageGet(STORAGE_KEYS.cRent),
    storageGet(STORAGE_KEYS.cSale), storageGet(STORAGE_KEYS.cMosh), storageGet(STORAGE_KEYS.cOther),
    storageGet(STORAGE_KEYS.settings), storageGet(STORAGE_KEYS.agentBackup),
    storageGet(STORAGE_KEYS.opportunities), storageGet(STORAGE_KEYS.officeCustomers)
  ]);
  DB.files=files||[]; DB.customers=customers||[]; DB.mMelk=mMelk||[]; DB.mSaz=mSaz||[]; DB.sazBank=sazBank||[];
  DB.cRent=cRent||[]; DB.cSale=cSale||[]; DB.cMosh=cMosh||[]; DB.cOther=cOther||[];
  DB.settings=settings||{ conversionRate:2.5, defaultFollowupDays:3 };

let __formState=null, __formFields=null, __formOnSave=null;

function inputHtml(f, val){
  const v = val===undefined||val===null? '' : val;
  if(f.type==='section') return `<div class="section-label">${esc(f.label)}</div>`;
  if(f.type==='computed') return `<div class="field ${f.span==='full'?'full':''}"><label>${esc(f.label)}</label><input data-computed="${f.key}" type="text" value="${esc(v)}" disabled style="background:var(--paper);font-weight:700;color:var(--ink)"></div>`;
  if(f.type==='checkbox') return `<div class="field ${f.span==='full'?'full':''}"><label>&nbsp;</label><div class="check-row"><input type="checkbox" data-key="${f.key}" id="chk_${f.key}" ${v?'checked':''}><label for="chk_${f.key}" style="margin:0">${esc(f.label)}</label></div></div>`;
  if(f.type==='select'){
    const opts = (f.options||[]).map(o=>`<option value="${esc(o)}" ${v===o?'selected':''}>${esc(o)}</option>`).join('');
    return `<div class="field ${f.span==='full'?'full':''}"><label>${esc(f.label)}</label><select data-key="${f.key}"><option value="">- انتخاب کنید -</option>${opts}</select></div>`;
  }
  if(f.type==='textarea') return `<div class="field ${f.span==='full'?'full':''}"><label>${esc(f.label)}</label><textarea data-key="${f.key}" rows="3">${esc(v)}</textarea></div>`;
  if(f.price){
    const shown = (v!==''&&v!==undefined&&v!==null) ? toFa(v) : '';
    return `<div class="field ${f.span==='full'?'full':''}"><label>${esc(f.label)}${f.required?' *':''}</label><input data-key="${f.key}" data-price="1" type="text" inputmode="numeric" placeholder="مثال: 9,600,000" value="${esc(shown)}"><div class="price-live" data-live="${f.key}" style="font-size:11px;color:var(--gold);margin-top:5px;line-height:1.7;min-height:14px"></div></div>`;
  }
  const type = f.type==='number'?'number':(f.type==='tel'?'tel':(f.type==='date'?'date':'text'));
  return `<div class="field ${f.span==='full'?'full':''}"><label>${esc(f.label)}${f.required?' *':''}</label><input data-key="${f.key}" type="${type}" value="${esc(v)}"></div>`;
}

function recomputeForm(){
  const d = __formState;
  // قیمت هر متر
  if('pricePerMeter' in d || __formFields.some(f=>f.key==='pricePerMeter')){
    const area = Number(d.area||d.buildingArea||0);
    const total = Number(d.totalPrice||0);
    d.pricePerMeter = area>0 ? Math.round(total/area) : 0;
  }
  document.querySelectorAll('[data-computed]').forEach(el=>{
    const k=el.getAttribute('data-computed');
    el.value = d[k]!==undefined ? toFa(d[k])+(k==='pricePerMeter'?' تومان':'') : '';
  });
  // پیش‌نمایش زنده‌ی مبلغ به تومان و حروف
  document.querySelectorAll('[data-live]').forEach(el=>{
    const k = el.getAttribute('data-live');
    const val = d[k];
    el.textContent = (val!==undefined && val!=='' && val!==null && !isNaN(Number(val))) ? (toFa(val)+' تومان — '+numberToWordsFa(val)) : '';
  });
  // نمایش/مخفی‌سازی showIf
  __formFields.forEach(f=>{
    if(f.showIf){
      const wrap = document.querySelector(`[data-key="${f.key}"]`);
      if(wrap){
        const container = wrap.closest('.field');
        if(container) container.style.display = f.showIf(d) ? '' : 'none';
      }
    }
  });
}

function openFormModal(title, fields, initialData, onSave, extraHtml){
  __formFields = fields; __formState = Object.assign({}, initialData||{}); __formOnSave = onSave;
  const root = document.getElementById('overlay-root');
  const body = fields.map(f=>inputHtml(f, __formState[f.key])).join('');
  root.innerHTML = `
    <div class="modal">
      <h3>${esc(title)}</h3>
      <div class="form-grid" id="dynamic-form">${body}</div>
      ${extraHtml||''}
      <div class="modal-actions">
        <button class="btn btn-outline" id="modal-cancel">انصراف</button>
        <button class="btn btn-primary" id="modal-save">ذخیره</button>
      </div>
    </div>`;
  root.classList.add('show');
  const formEl = document.getElementById('dynamic-form');
  formEl.addEventListener('input', (e)=>{
    const key = e.target.getAttribute('data-key');
    if(!key) return;
    if(e.target.hasAttribute('data-price')){
      const digits = e.target.value.replace(/[^\d]/g,'');
      __formState[key] = digits===''? '': Number(digits);
      const formatted = digits===''? '' : Number(digits).toLocaleString('en-US');
      if(e.target.value !== formatted) e.target.value = formatted;
    }
    else if(e.target.type==='checkbox') __formState[key]=e.target.checked;
    else if(e.target.type==='number') __formState[key]= e.target.value===''? '': Number(e.target.value);
    else __formState[key]=e.target.value;
    recomputeForm();
  });
  formEl.addEventListener('change', (e)=>{
    const key = e.target.getAttribute('data-key');
    if(!key) return;
    if(e.target.tagName==='SELECT') __formState[key]=e.target.value;
  });
  recomputeForm();
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save').onclick = ()=>{
    for(const f of fields){

function filePriceBoxHtml(item){

function applySearchSortFilter(list, scopeKey, searchFields, priceFn){
  let arr = list.slice();
  const q = (UI.search[scopeKey]||'').trim().toLowerCase();
  if(q) arr = arr.filter(it=> searchFields.some(f=> String(it[f]||'').toLowerCase().includes(q)));
  const min = Number(UI.priceMin[scopeKey]||0), max = Number(UI.priceMax[scopeKey]||0);
  if(min) arr = arr.filter(it=> priceFn(it) >= min);
  if(max) arr = arr.filter(it=> priceFn(it) <= max);
  const sort = UI.sort[scopeKey];
  if(sort==='price_desc') arr.sort((a,b)=>priceFn(b)-priceFn(a));
  else if(sort==='price_asc') arr.sort((a,b)=>priceFn(a)-priceFn(b));
  else if(sort==='newest') arr.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  else arr.sort((a,b)=> new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt));
  return arr;
}

const CONTRACT_MAP = { rent:{coll:'cRent', label:'اجاره'}, sale:{coll:'cSale', label:'فروش'}, mosharekat:{coll:'cMosh', label:'مشارکت در ساخت'}, other:{coll:'cOther', label:'بنگاه دیگر'} };

function resizeImageFile(file, maxW){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function openContractModal(kind, existing){
  const meta = CONTRACT_MAP[kind];
  const data = existing? Object.assign({}, existing) : { renewalAlarmDays: kind==='rent'||kind==='other'?30:undefined };
  const photos = (data.photos||[]).slice();
  const extraHtml = `
    <div class="section-label" style="margin-top:14px">پیوست عکس قرارداد</div>
    <div class="upload-box" id="contract-upload-box">📎 برای افزودن عکس قرارداد کلیک کنید</div>
    <input type="file" id="contract-file-input" accept="image/*" multiple style="display:none">
    <div class="photo-row" id="contract-photo-row"></div>`;
  openFormModal((existing?'ویرایش':'ثبت')+' قرارداد '+meta.label, contractFields(kind), data, async (formData)=>{
    formData.photos = photos;
    if(existing){
      Object.assign(existing, formData); existing.updatedAt=nowIso();
    } else {
      formData.id=uid(); formData.agentName = formData.agentName||SESSION.name; formData.createdAt=nowIso(); formData.updatedAt=nowIso();
      DB[meta.coll].push(formData);
    }
    await saveCollection(meta.coll); toast('قرارداد ذخیره شد ✓'); renderApp();
  }, extraHtml);

  function renderPhotoRow(){
    const row = document.getElementById('contract-photo-row');
    if(!row) return;
    row.innerHTML = photos.map((p,i)=>`<div class="ph"><img src="${p}" onclick="window.__viewContractPhoto(${i})"><button onclick="event.stopPropagation();window.__removeContractPhoto(${i})">×</button></div>`).join('');
  }
  function removePhotoInline(i){ photos.splice(i,1); renderPhotoRow(); }
  window.__removeContractPhoto = removePhotoInline;
  window.__viewContractPhoto = (i)=>{ const w=window.open(); if(w) w.document.write('<img src="'+photos[i]+'" style="max-width:100%">'); };
  setTimeout(()=>{
    renderPhotoRow();
    const box = document.getElementById('contract-upload-box');
    const inp = document.getElementById('contract-file-input');
    if(box) box.onclick = ()=> inp.click();
    if(inp) inp.onchange = async ()=>{
      for(const file of inp.files){
        const dataUrl = await resizeImageFile(file, 900);
        photos.push(dataUrl);
      }
      renderPhotoRow();
      inp.value='';
    };
  }, 0);
}

/* =========================================================================
   تطبیق فایل (matching) — حداقل ۸۰٪ شباهت قیمت
   ========================================================================= */
function computeMatches(dealCategory){ // 'sale-buy' or 'rent'
  const results = []; // [{customer, matches:[{file, score}]}]
  const customers = DB.customers.filter(c=> (dealCategory==='rent'? c.dealType==='rent' : c.dealType==='buy'));
  const files = DB.files.filter(f=> (dealCategory==='rent'? f.dealType==='rent' : f.dealType==='sale'));
  customers.forEach(cust=>{
    const matches=[];
    files.filter(f=>f.propType===cust.propType).forEach(file=>{
      let score;
      if(dealCategory==='rent'){
        const s1 = priceSimilarity(cust.budgetRahn, file.rahnPrice);
        const s2 = priceSimilarity(cust.budgetEjare, file.ejarePrice);
        score = Math.min(s1,s2);
      } else {
        const budgetMid = cust.budgetMax || cust.budgetMin || 0;
        score = priceSimilarity(budgetMid, file.totalPrice);
        // اگر بازه بودجه مشخص شده، فایل داخل یا نزدیک بازه هم قبول است
        if(cust.budgetMin && cust.budgetMax && file.totalPrice>=cust.budgetMin && file.totalPrice<=cust.budgetMax) score = Math.max(score, 0.95);
      }
      if(score >= 0.8) matches.push({file, score});
    });
    if(matches.length){
      matches.sort((a,b)=>b.score-a.score);
      results.push({customer:cust, matches});
    }
  });
  return results;
}

function agentDataSnapshot(agentName){
  return {
    exportedAt: nowIso(), agentName,
    files: DB.files.filter(f=>f.agentName===agentName),
    customers: DB.customers.filter(c=>c.agentName===agentName),
    mMelk: DB.mMelk.filter(x=>x.agentName===agentName),
    mSaz: DB.mSaz.filter(x=>x.agentName===agentName),
    sazBank: DB.sazBank.filter(x=>x.agentName===agentName),
  };
}
async function doBackupDownload(){
  const snap = agentDataSnapshot(SESSION.name);
  const blob = new Blob([JSON.stringify(snap,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = `backup-${SESSION.name}-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  DB.backupMeta[SESSION.name] = nowIso();
  await saveCollection('backupMeta');
  toast('بک‌آپ دانلود شد ✓');
  renderApp();
}
function handleRestoreFile(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const snap = JSON.parse(e.target.result);
      if(!confirm('اطلاعات این فایل بک‌آپ به لیست فعلی اضافه شود؟ (رکوردهای تکراری بر اساس شناسه نادیده گرفته می‌شوند)')) return;
      const mergeArr=(target, source)=>{
        const ids = new Set(target.map(x=>x.id));
        (source||[]).forEach(x=>{ if(!ids.has(x.id)){ target.push(x); ids.add(x.id); } });
      };
      mergeArr(DB.files, snap.files); mergeArr(DB.customers, snap.customers);
      mergeArr(DB.mMelk, snap.mMelk); mergeArr(DB.mSaz, snap.mSaz); mergeArr(DB.sazBank, snap.sazBank);
      await Promise.all(['files','customers','mMelk','mSaz','sazBank'].map(saveCollection));
      toast('بازیابی با موفقیت انجام شد ✓'); renderApp();
    }catch(err){ toast('فایل بک‌آپ نامعتبر است'); }
  };
  reader.readAsText(file);
}
function hoursSinceBackup(agentName){
  const last = DB.backupMeta[agentName];
  if(!last) return Infinity;
  return (new Date()-new Date(last))/(1000*60*60);
}

}

  const kvHtml = kv.map(([k,v])=>`<div><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join('');
  return `
  <div class="card" data-id="${item.id}">
    <div class="card-top">
      <div>
        <div class="card-title">${esc(item.ownerName||'بدون نام')}</div>

function pageAccounting(){
  const all = [
    ...DB.cRent.map(c=>({...c, kind:'rent'})), ...DB.cSale.map(c=>({...c, kind:'sale'})), ...DB.cMosh.map(c=>({...c, kind:'mosharekat'}))
  ].filter(c=>c.commissionTotal);
  const totalCommission = all.reduce((s,c)=>s+Number(c.commissionTotal||0),0);
  const totalAgentShare = all.reduce((s,c)=>s+Math.round(Number(c.commissionTotal||0)*Number(c.agentSharePercent||0)/100),0);
  const totalOfficeShare = totalCommission-totalAgentShare;
  const byAgent = {};
  all.forEach(c=>{
    const a = c.agentName || 'نامشخص';
    if(!byAgent[a]) byAgent[a]={count:0, commission:0, agentShare:0};
    byAgent[a].count++; byAgent[a].commission += Number(c.commissionTotal||0);
    byAgent[a].agentShare += Math.round(Number(c.commissionTotal||0)*Number(c.agentSharePercent||0)/100);
  });
  const maxCommission = Math.max(1, ...Object.values(byAgent).map(x=>x.commission));
  const kindLabel={rent:'اجاره',sale:'فروش',mosharekat:'مشارکت'};
  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="n">${toFa(totalCommission)}</div><div class="l">جمع کل کمیسیون (تومان)</div></div>
    <div class="stat-card"><div class="n">${toFa(totalAgentShare)}</div><div class="l">جمع سهم مشاوران (تومان)</div></div>
    <div class="stat-card"><div class="n">${toFa(totalOfficeShare)}</div><div class="l">جمع سهم دفتر (تومان)</div></div>
    <div class="stat-card"><div class="n">${all.length}</div><div class="l">تعداد قراردادهای دارای کمیسیون</div></div>
  </div>
  <div class="section-title">📊 سهم هر مشاور از کمیسیون</div>
  <div class="card">
    ${Object.keys(byAgent).length===0? `<div class="empty-state"><div class="ic">📊</div>هنوز کمیسیونی ثبت نشده است</div>` :
    Object.entries(byAgent).map(([a,v])=>`
      <div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px">
          <span>${esc(a)} (${v.count} قرارداد)</span><span>${toFa(v.commission)} تومان</span>
        </div>
        <div style="background:var(--paper);border-radius:8px;height:10px;overflow:hidden">
          <div style="background:linear-gradient(90deg,var(--gold),var(--gold-2));height:100%;width:${(v.commission/maxCommission*100).toFixed(1)}%"></div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">سهم مشاور: ${toFa(v.agentShare)} تومان — سهم دفتر: ${toFa(v.commission-v.agentShare)} تومان</div>
      </div>`).join('')}
  </div>
  <div class="section-title">📋 لیست کامل تراکنش‌های کمیسیون</div>
  <div class="table-wrap"><table><thead><tr><th>نوع</th><th>آدرس</th><th>مشاور</th><th>کمیسیون کل</th><th>سهم مشاور (٪)</th><th>مبلغ سهم مشاور</th><th>سهم دفتر</th><th>تاریخ</th></tr></thead><tbody>
  ${all.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(c=>{
    const agentAmt = Math.round(Number(c.commissionTotal||0)*Number(c.agentSharePercent||0)/100);
    return `<tr><td>${kindLabel[c.kind]}</td><td>${esc((c.address||'').slice(0,28))}</td><td>${esc(c.agentName||'-')}</td><td>${toFa(c.commissionTotal)}</td><td>${c.agentSharePercent||0}٪</td><td>${toFa(agentAmt)}</td><td>${toFa(Number(c.commissionTotal||0)-agentAmt)}</td><td>${faDate(c.startDate||c.contractDate)}</td></tr>`;
  }).join('')}
  </tbody></table></div>`;
}

    <div class="brand"><img src="${LOGO_FULL}" alt="اسپرلوس" style="width:170px;max-width:70%;margin:0 auto 8px;display:block"><p>سامانه مدیریت املاک</p></div>

  </div>`;

    const p = document.getElementById('login-password');
    if(p) p.onkeydown=(e)=>{ if(e.key==='Enter') doLogin(); };
  },0);

async function doFirstSetup(){
  const name=(document.getElementById('setup-name').value||'').trim();
  const username=(document.getElementById('setup-username').value||'').trim().toLowerCase();
  const password=document.getElementById('setup-password').value||'';
  if(!name||!username||!password){ toast('همه فیلدها را پر کنید'); return; }
  if(password.length<4){ toast('رمز عبور باید حداقل ۴ کاراکتر باشد'); return; }
  try{
    const r = await fetch(API_BASE+'/api/setup', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,username,password})});
    const body = await r.json();
    if(!r.ok){ toast(body.error==='already_setup'? 'سامانه قبلاً راه‌اندازی شده':'خطا در راه‌اندازی'); return; }
    TOKEN = body.token; localStorage.setItem('sl_token', TOKEN);
    SESSION = { role: body.account.role, name: body.account.name, username: body.account.username, accountId: body.account.id };
    await loadAll();
    UI.page='admin_dashboard';
    renderApp();
  }catch(e){ toast('اتصال به سرور برقرار نشد'); }
}
async function doLogin(){
  const username=(document.getElementById('login-username').value||'').trim().toLowerCase();
  const password=document.getElementById('login-password').value||'';
  if(!username||!password){ toast('نام کاربری و رمز عبور را وارد کنید'); return; }
  try{
    const r = await fetch(API_BASE+'/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,password})});
    const body = await r.json();
    if(!r.ok){ toast('نام کاربری یا رمز عبور اشتباه است'); return; }
    TOKEN = body.token; localStorage.setItem('sl_token', TOKEN);
    SESSION = { role: body.account.role, name: body.account.name, username: body.account.username, accountId: body.account.id };
    await loadAll();
    UI.page = body.account.role==='admin'? 'admin_dashboard':'dashboard';
    renderApp();
  }catch(e){ toast('اتصال به سرور برقرار نشد'); }
}

async function saveEditAgentAccount(id){
  const acc = DB.accounts.find(a=>a.id===id); if(!acc) return;
  const newName=(document.getElementById('edit-agent-name').value||'').trim();
  const newUsername=(document.getElementById('edit-agent-username').value||'').trim().toLowerCase();
  if(!newName||!newUsername){ toast('همه فیلدها را پر کنید'); return; }
  const oldName = acc.name;
  try{
    await apiFetch('/api/accounts/'+id, {method:'PUT', body: JSON.stringify({name:newName, username:newUsername})});
    // به‌روزرسانی agentName در تمام رکوردهای قبلی این مشاور
    if(oldName!==newName){
      [DB.files,DB.customers,DB.mMelk,DB.mSaz,DB.sazBank].forEach(coll=>coll.forEach(r=>{ if(r.agentName===oldName) r.agentName=newName; }));
      await Promise.all(['files','customers','mMelk','mSaz','sazBank'].map(saveCollection));
    }
    toast('ذخیره شد ✓'); closeModal(); await loadAll(); renderApp();
  }catch(e){
    toast(e.body && e.body.error==='username_taken' ? 'این نام کاربری قبلاً استفاده شده' : 'خطا در ذخیره');
  }
}

async function saveNewPassword(id){
  const val = document.getElementById('new-pass-val').value||'';
  if(val.length<4){ toast('رمز عبور باید حداقل ۴ کاراکتر باشد'); return; }
  try{
    await apiFetch('/api/accounts/'+id, {method:'PUT', body: JSON.stringify({password:val})});
    toast('رمز عبور تغییر کرد ✓'); closeModal();
  }catch(e){ toast('خطا در تغییر رمز'); }
}
async function deleteAgentAccount(id){
  if(!confirm('این حساب مشاور حذف شود؟ (اطلاعات فایل و مشتری او حذف نمی‌شود)')) return;
  try{
    await apiFetch('/api/accounts/'+id, {method:'DELETE'});
    toast('حساب حذف شد'); await loadAll(); renderApp();
  }catch(e){ toast('خطا در حذف حساب'); }
}

/* =========================================================================
   ویرایش نام‌کاربری/رمز خودم — فقط برای مدیر (مشاوران این اجازه را ندارند؛
   نام‌کاربری/رمز مشاوران را فقط مدیر از صفحه‌ی «مدیریت حساب مشاوران» تعیین می‌کند)
   ========================================================================= */
function openMyAccountModal(){
  const root=document.getElementById('overlay-root');
  root.innerHTML=`<div class="modal"><h3>ویرایش اطلاعات ورود من</h3>
    <div class="form-grid">
      <div class="field full"><label>نام و نام خانوادگی</label><input type="text" id="my-acc-name" value="${esc(SESSION.name)}"></div>
      <div class="field full"><label>نام کاربری</label><input type="text" id="my-acc-username" value="${esc(SESSION.username||'')}"></div>
      <div class="field full"><label>رمز عبور جدید (اختیاری — اگر نمی‌خواهید عوض شود، خالی بگذارید)</label><input type="password" id="my-acc-password" placeholder="فقط در صورت تغییر پر کنید"></div>
    </div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="saveMyAccount()">ذخیره</button></div>
  </div>`;
  root.classList.add('show');
}
async function saveMyAccount(){
  const name=(document.getElementById('my-acc-name').value||'').trim();
  const username=(document.getElementById('my-acc-username').value||'').trim().toLowerCase();
  const password=document.getElementById('my-acc-password').value||'';
  if(!name||!username){ toast('نام و نام کاربری را پر کنید'); return; }
  if(password && password.length<4){ toast('رمز عبور جدید باید حداقل ۴ کاراکتر باشد'); return; }
  const body={name, username};
  if(password) body.password=password;
  try{
    const r = await apiFetch('/api/me', {method:'PUT', body: JSON.stringify(body)});
    SESSION.name=r.account.name; SESSION.username=r.account.username;
    toast('اطلاعات ورود شما به‌روزرسانی شد ✓'); closeModal(); renderApp();
  }catch(e){
    toast(e.body && e.body.error==='username_taken' ? 'این نام کاربری قبلاً استفاده شده' : 'خطا در ذخیره');
  }
}

/* =========================================================================
   INIT
   ========================================================================= */
(async function init(){
  const favicon = document.createElement('link');
  favicon.rel = 'icon'; favicon.type = 'image/png'; favicon.href = LOGO_CREST;
  document.head.appendChild(favicon);
  document.getElementById('login-screen').innerHTML = `<div style="color:#EDE7D8;font-family:'Vazirmatn'">در حال بارگذاری…</div>`;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-screen').style.cssText='min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy),var(--navy-2))';
  if(TOKEN){
    try{
      const r = await fetch(API_BASE+'/api/me', {headers:{'Authorization':'Bearer '+TOKEN}});
      if(r.ok){
        const body = await r.json();
        SESSION = { role: body.account.role, name: body.account.name, username: body.account.username, accountId: body.account.id };
        await loadAll();
        UI.page = SESSION.role==='admin'? 'admin_dashboard':'dashboard';
        renderApp();
        return;
      } else {
        TOKEN=null; localStorage.removeItem('sl_token');
      }
    }catch(e){ /* سرور در دسترس نبود، به صفحه ورود می‌رویم */ }
  }
  renderLogin();
})();
</script>
