/* =========================================================================
   تطبیق فایل (matching) — حداقل ۸۰٪ شباهت قیمت
   ========================================================================= */
function computeMatchesGeneric(dealCategory, customersList, filesList){ // 'sale-buy' or 'rent'
  const results = []; // [{customer, matches:[{file, score}]}]
  const customers = customersList.filter(c=> (dealCategory==='rent'? c.dealType==='rent' : c.dealType==='buy'));
  const files = filesList.filter(f=> !isArchivedFile(f) && (dealCategory==='rent'? f.dealType==='rent' : f.dealType==='sale'));
  customers.forEach(cust=>{
    const matches=[];
    files.filter(f=>f.propType===cust.propType).forEach(file=>{
      let score;
      if(dealCategory==='rent'){
        const s1 = priceSimilarity(cust.budgetRahn, file.rahnPrice);
        const s2 = priceSimilarity(cust.budgetEjare, file.ejarePrice);
        score = Math.min(s1,s2);
      } else {
        const budgetMid = cust.budgetMax || cust.budgetMin || 0;
        score = priceSimilarity(budgetMid, file.totalPrice);
        // اگر بازه بودجه مشخص شده، فایل داخل یا نزدیک بازه هم قبول است
        if(cust.budgetMin && cust.budgetMax && file.totalPrice>=cust.budgetMin && file.totalPrice<=cust.budgetMax) score = Math.max(score, 0.95);
      }
      if(score >= 0.8) matches.push({file, score});
    });
    if(matches.length){
      matches.sort((a,b)=>b.score-a.score);
      results.push({customer:cust, matches});
    }
  });
  return results;
}
// مطابقت مشتریان مشاوران با فایل‌های مشاوران + فایل‌های دفتر (یکجا، در یک کادر واحد برای هر مشتری)
function computeMatches(dealCategory){
  const combinedFiles = [
    ...DB.files.map(f=>({...f, __isOffice:false})),
    ...DB.officeFiles.map(f=>({...f, __isOffice:true})),
  ];
  return computeMatchesGeneric(dealCategory, DB.customers, combinedFiles);
}
// مطابقت «مشتریان دفتر» (بانک مشتری مدیر) با فایل‌های مشاوران
function computeOfficeCustomerMatches(dealCategory){
  return computeMatchesGeneric(dealCategory, DB.officeCustomers, DB.files);
}

  openFormModal('ویرایش تردد', attendanceFields(), formData, async (data)=>{
    Object.assign(item, data); item.updatedAt=nowIso();
    await saveCollection('attendance');
    toast('ذخیره شد ✓');
    renderApp();
  });
}

/* =========================================================================
   گفتگوی داخلی (چت): مدیر ⇄ مشاوران، با نوتیف پیام جدید
   ========================================================================= */
function unreadChatCount(agentName){
  if(!SESSION) return 0;
  if(SESSION.role==='admin'){
    return DB.messages.filter(m=> (!agentName || m.agentName===agentName) && !m.readByAdmin).length;
  }
  return DB.messages.filter(m=> m.agentName===SESSION.name && !m.readByAgent).length;
}
async function markChatRead(agentName){
  try{
    await apiFetch('/api/messages/read', {method:'POST', body: JSON.stringify(SESSION.role==='admin'?{agentName}:{})});
  }catch(e){ /* بی‌صدا رد شو */ }
  DB.messages.forEach(m=>{
    if(SESSION.role==='admin'){ if(!agentName || m.agentName===agentName) m.readByAdmin=true; }
    else if(m.agentName===SESSION.name) m.readByAgent=true;
  });
}
async function sendChatMessage(toAgent, text){
  text = (text||'').trim();
  if(!text) return;
  try{
    const body = SESSION.role==='admin' ? {text, toAgent} : {text};
    const r = await apiFetch('/api/messages', {method:'POST', body: JSON.stringify(body)});
    if(r && r.message) DB.messages.push(r.message);
    __lastUnreadChat = unreadChatCount();
    renderApp();
  }catch(e){ toast('ارسال پیام ناموفق بود'); }
}
function chatBubbleHtml(m, mineRole){
  const mine = m.senderRole===mineRole;
  return `<div style="align-self:${mine?'flex-end':'flex-start'};max-width:80%;background:${mine?'var(--gold)':'var(--card,#fff)'};color:${mine?'#1a1a1a':'inherit'};padding:8px 12px;border-radius:12px;border:1px solid var(--line)">
    <div style="font-size:11px;opacity:.7;margin-bottom:3px">${m.senderRole==='admin'?'مدیریت':esc(m.senderName)} — ${faDateTime(m.createdAt)}</div>
    <div style="white-space:pre-wrap">${esc(m.text)}</div>
  </div>`;
}
function submitChatFromInput(){

  const toAgent = SESSION.role==='admin' ? UI.tab.chatAgent : null;

/* =========================================================================
   بک‌آپ گیری (هر ۲۴ ساعت)
   ========================================================================= */
function agentDataSnapshot(agentName){
  return {
    exportedAt: nowIso(), agentName,
    files: DB.files.filter(f=>f.agentName===agentName),
    customers: DB.customers.filter(c=>c.agentName===agentName),
    mMelk: DB.mMelk.filter(x=>x.agentName===agentName),
    mSaz: DB.mSaz.filter(x=>x.agentName===agentName),
    sazBank: DB.sazBank.filter(x=>x.agentName===agentName),
  };
}
async function doBackupDownload(){
  const snap = agentDataSnapshot(SESSION.name);
  const blob = new Blob([JSON.stringify(snap,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = `backup-${SESSION.name}-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  DB.backupMeta[SESSION.name] = nowIso();
  await saveCollection('backupMeta');
  toast('بک‌آپ دانلود شد ✓');
  renderApp();
}
function handleRestoreFile(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const snap = JSON.parse(e.target.result);
      if(!confirm('اطلاعات این فایل بک‌آپ به لیست فعلی اضافه شود؟ (رکوردهای تکراری بر اساس شناسه نادیده گرفته می‌شوند)')) return;
      const mergeArr=(target, source)=>{
        const ids = new Set(target.map(x=>x.id));
        (source||[]).forEach(x=>{ if(!ids.has(x.id)){ target.push(x); ids.add(x.id); } });
      };
      mergeArr(DB.files, snap.files); mergeArr(DB.customers, snap.customers);
      mergeArr(DB.mMelk, snap.mMelk); mergeArr(DB.mSaz, snap.mSaz); mergeArr(DB.sazBank, snap.sazBank);
      await Promise.all(['files','customers','mMelk','mSaz','sazBank'].map(saveCollection));
      toast('بازیابی با موفقیت انجام شد ✓'); renderApp();
    }catch(err){ toast('فایل بک‌آپ نامعتبر است'); }
  };
  reader.readAsText(file);
}
function hoursSinceBackup(agentName){
  const last = DB.backupMeta[agentName];
  if(!last) return Infinity;
  return (new Date()-new Date(last))/(1000*60*60);
}

function matchGroupHtml(group, kind){
  const isAdmin = SESSION.role==='admin';
  const cust = group.customer;
  const custIsOffice = kind==='officeCustomers';
  const VISIBLE_COUNT = 3;
  const renderOne = (m)=>{

    const maskAgent = kind==='std' && !isAdmin && !m.file.__isOffice && m.file.agentName && m.file.agentName!==SESSION.name;
    return matchFileCardHtml(m.file, {score:m.score, maskAgent, showAgentMeta: isAdmin});

  const visible = group.matches.slice(0, VISIBLE_COUNT);

  const custTitle = custIsOffice

    <div class="grid" style="margin-top:8px">${visible.map(renderOne).join('')}</div>

  const stdRent = computeMatches('rent').filter(r=> r.customer.agentName===SESSION.name || isAdmin);

  const filterOfficeCustResults = (raw)=> isAdmin ? raw :
    raw.map(r=>({customer:r.customer, matches:r.matches.filter(m=>m.file.agentName===SESSION.name)})).filter(r=>r.matches.length);
  const officeCustRent = filterOfficeCustResults(computeOfficeCustomerMatches('rent'));
  const officeCustSale = filterOfficeCustResults(computeOfficeCustomerMatches('sale'));

  const countRent = stdRent.length + officeCustRent.length;
  const countSale = stdSale.length + officeCustSale.length;

  let std = cat==='rent'? stdRent : stdSale;
  let officeCustResults = cat==='rent'? officeCustRent : officeCustSale;
  const section1CountForCat = std.length, section2CountForCat = officeCustResults.length;

  // جستجو بر اساس نام مشتری — هم روی بخش «مشتری × فایل‌ها» و هم روی بخش «مشتریان دفتر»
  const searchId = 'tb-search-matching';
  const q = (UI.search.matching||'').trim().toLowerCase();
  if(q){
    std = std.filter(r=> String(r.customer.name||'').toLowerCase().includes(q));
    officeCustResults = officeCustResults.filter(r=> String(r.customer.name||'').toLowerCase().includes(q));
  }

  const shown = section==='2' ? officeCustResults : std;
  const shownKind = section==='2' ? 'officeCustomers' : 'std';
  const shownTitle = section==='2' ? '🏢 مطابقت مشتریان دفتر با فایل‌های شما' : '🔍 مطابقت مشتریان با فایل‌ها (خودِ مشاور، دفتر و سایر مشاوران)';

  return `
  <div class="tabs">
    <button class="tab-btn ${cat==='rent'?'active':''}" onclick="UI.tab.matching='rent';renderApp();">رهن و اجاره <span class="tab-count">${toFa(countRent)}</span></button>
    <button class="tab-btn ${cat==='sale'?'active':''}" onclick="UI.tab.matching='sale';renderApp();">خرید و فروش <span class="tab-count">${toFa(countSale)}</span></button>
  </div>
  <div class="tabs">
    <button class="tab-btn ${section==='1'?'active':''}" onclick="UI.tab.matchingSection='1';renderApp();">۱) مشتری با فایل‌ها <span class="tab-count">${toFa(section1CountForCat)}</span></button>
    <button class="tab-btn ${section==='2'?'active':''}" onclick="UI.tab.matchingSection='2';renderApp();">۲) مشتریان دفتر با فایل‌های شما <span class="tab-count">${toFa(section2CountForCat)}</span></button>
  </div>
  <div class="toolbar">
    <input id="${searchId}" type="text" class="grow" placeholder="جستجو بر اساس نام مشتری" value="${esc(UI.search.matching||'')}" oninput="UI.search.matching=this.value; refocusAfterRender('${searchId}');">
  </div>
  ${shown.length===0? `<div class="empty-state"><div class="ic">🔍</div>${q? 'با این نام مطابقتی یافت نشد' : 'در حال حاضر تطبیقی با شباهت قیمت حداقل ۸۰٪ یافت نشد'}</div>` :
    `<div class="section-title">${shownTitle}</div>${shown.map(r=>matchGroupHtml(r,shownKind)).join('')}`}
  `;
}

function agentPerformancePeriodStart(period){
  const now = new Date();
  if(period==='today'){ return addDays(now.toISOString(), -1); } // ۱ روز اخیر (۲۴ ساعت گذشته)، هم‌الگو با last30/last90
  if(period==='month'){ return new Date(now.getFullYear(), now.getMonth(), 1).toISOString(); }
  if(period==='last30'){ return addDays(now.toISOString(), -30); }
  if(period==='last90'){ return addDays(now.toISOString(), -90); }
  return null; // all-time
}
function computeAgentPerformance(agentName, periodStartIso){
  const inPeriod = (d)=> !periodStartIso || (d && new Date(d) >= new Date(periodStartIso));

  const files = DB.files.filter(f=>f.agentName===agentName && inPeriod(f.createdAt));
  const filesActive = files.filter(f=>!isArchivedFile(f));
  const filesArchived = files.filter(f=>isArchivedFile(f));
  const filesSold = files.filter(f=>f.status==='closed');
  const filesExpired = files.filter(f=>f.status==='expired');
  const filesRent = files.filter(f=>f.dealType==='rent');
  const filesSale = files.filter(f=>f.dealType==='sale');
  const filesByProp = {};
  files.forEach(f=>{ const k=propTypeLabel(f.propType); filesByProp[k]=(filesByProp[k]||0)+1; });

  const customers = DB.customers.filter(c=>c.agentName===agentName && inPeriod(c.createdAt));
  const custRent = customers.filter(c=>c.dealType==='rent');
  const custBuy = customers.filter(c=>c.dealType==='buy');

  const opportunities = DB.opportunities.filter(o=>o.agentName===agentName && inPeriod(o.createdAt));
  const overdueOpp = opportunities.filter(o=>o.nextFollowupDate && new Date(o.nextFollowupDate) <= new Date());

  const cRent = DB.cRent.filter(c=>c.agentName===agentName && inPeriod(c.createdAt));
  const cSale = DB.cSale.filter(c=>c.agentName===agentName && inPeriod(c.createdAt));
  const cMosh = DB.cMosh.filter(c=>c.agentName===agentName && inPeriod(c.createdAt));
  const cOther = DB.cOther.filter(c=>c.agentName===agentName && inPeriod(c.createdAt));
  const commissionable = [...cRent, ...cSale, ...cMosh];
  const totalContracts = commissionable.length + cOther.length;
  const totalCommission = commissionable.reduce((s,c)=>s+Number(c.commissionTotal||0),0);
  const agentShare = commissionable.reduce((s,c)=>s+agentShareAmountFor(c, agentName),0);
  const officeShare = totalCommission - agentShare;
  const teaBoy = commissionable.reduce((s,c)=>s+Number(c.teaBoyFee||0),0);

  const mMelk = DB.mMelk.filter(x=>x.agentName===agentName && inPeriod(x.createdAt));
  const mSaz = DB.mSaz.filter(x=>x.agentName===agentName && inPeriod(x.createdAt));
  const sazBank = DB.sazBank.filter(x=>x.agentName===agentName && inPeriod(x.createdAt));

  const activity = DB.activityLogs.filter(a=>a.agentName===agentName && inPeriod(a.date||a.createdAt));
  const totalCalls = activity.reduce((s,a)=>s+Number(a.calls||0),0);
  const totalViewings = activity.reduce((s,a)=>s+Number(a.viewings||0),0);
  const totalDivarAds = activity.reduce((s,a)=>s+Number(a.divarAds||0),0);

  const allDates = [...files, ...customers, ...opportunities, ...commissionable, ...cOther]
    .map(x=>x.updatedAt||x.createdAt).filter(Boolean).sort((a,b)=>new Date(b)-new Date(a));
  const lastActivity = allDates[0] || null;
  const idleDays = lastActivity? daysBetween(lastActivity, new Date().toISOString()) : null;

  const registeredTotal = files.length + customers.length;
  const conversionRate = registeredTotal>0 ? Math.round((totalContracts/registeredTotal)*100) : 0;

  const closedWithDuration = filesSold.filter(f=>f.archivedAt && f.createdAt);
  const avgDaysToClose = closedWithDuration.length
    ? Math.round(closedWithDuration.reduce((s,f)=>s+daysBetween(f.createdAt, f.archivedAt),0)/closedWithDuration.length)
    : null;

  return {
    agentName, files, filesActive, filesArchived, filesSold, filesExpired, filesRent, filesSale, filesByProp,
    customers, custRent, custBuy, opportunities, overdueOpp,
    cRent, cSale, cMosh, cOther, totalContracts, totalCommission, agentShare, officeShare, teaBoy,
    mMelk, mSaz, sazBank, lastActivity, idleDays, registeredTotal, conversionRate, avgDaysToClose,
    activity, totalCalls, totalViewings, totalDivarAds,
    lastBackup: DB.backupMeta[agentName] || null,
  };
}
function agentRosterForPerformance(){
  const names = new Set();
  DB.accounts.filter(a=>a.role==='agent').forEach(a=>names.add(a.name));
  agentList().forEach(n=>names.add(n));
  return Array.from(names);
}

function pageAgentPerformance(){
  const period = UI.tab.perfPeriod || 'all';
  const selectedAgent = UI.tab.perfAgent || '';
  UI.tab.perfPeriod = period; UI.tab.perfAgent = selectedAgent;
  const periodStart = agentPerformancePeriodStart(period);
  const roster = agentRosterForPerformance().sort((a,b)=>a.localeCompare(b,'fa'));
  const allPerf = roster.map(a=>computeAgentPerformance(a, periodStart));

  const officeFiles = allPerf.reduce((s,p)=>s+p.files.length,0);
  const officeCustomers = allPerf.reduce((s,p)=>s+p.customers.length,0);
  const officeContracts = allPerf.reduce((s,p)=>s+p.totalContracts,0);
  const officeCommission = allPerf.reduce((s,p)=>s+p.totalCommission,0);
  const officeCalls = allPerf.reduce((s,p)=>s+p.totalCalls,0);
  const officeViewings = allPerf.reduce((s,p)=>s+p.totalViewings,0);
  const officeDivarAds = allPerf.reduce((s,p)=>s+p.totalDivarAds,0);

  const ranked = allPerf.slice().sort((a,b)=>b.totalCommission-a.totalCommission);
  const maxCommission = Math.max(1, ...ranked.map(p=>p.totalCommission));

  const shownList = selectedAgent ? allPerf.filter(p=>p.agentName===selectedAgent) : ranked;

  const periodTabs = [['all','همه‌ی زمان‌ها'],['month','از ابتدای این ماه'],['last30','۳۰ روز اخیر'],['last90','۹۰ روز اخیر'],['today','۱ روز اخیر']];

  return `
  <div class="tabs">
    ${periodTabs.map(([k,label])=>`<button class="tab-btn ${period===k?'active':''}" onclick="UI.tab.perfPeriod='${k}';renderApp();">${label}</button>`).join('')}

    <div class="stat-card"><div class="n">${toFa(officeFiles)}</div><div class="l">فایل ثبت‌شده در بازه</div></div>
    <div class="stat-card"><div class="n">${toFa(officeCustomers)}</div><div class="l">مشتری ثبت‌شده در بازه</div></div>
    <div class="stat-card"><div class="n">${toFa(officeContracts)}</div><div class="l">قرارداد در بازه</div></div>

    <div class="stat-card"><div class="n">${toFa(officeCalls)}</div><div class="l">تماس در بازه</div></div>
    <div class="stat-card"><div class="n">${toFa(officeViewings)}</div><div class="l">بازدید در بازه</div></div>
    <div class="stat-card"><div class="n">${toFa(officeDivarAds)}</div><div class="l">آگهی دیوار در بازه</div></div>
  </div>

  ${!selectedAgent? `

  <div class="card" style="margin-bottom:16px">

   پنل مدیریت: حسابداری
   ========================================================================= */
function pageAccounting(){
  const all = [
    ...DB.cRent.map(c=>({...c, kind:'rent'})), ...DB.cSale.map(c=>({...c, kind:'sale'})), ...DB.cMosh.map(c=>({...c, kind:'mosharekat'}))
  ].filter(c=>c.commissionTotal || c.shiriniAbdarchi);
  const totalCommission = all.reduce((s,c)=>s+Number(c.commissionTotal||0),0);
  const totalAgentShare = all.reduce((s,c)=>s+contractAgentShareTotal(c),0);
  const totalOfficeShare = totalCommission-totalAgentShare;
  const totalShirini = all.reduce((s,c)=>s+Number(c.shiriniAbdarchi||0),0);
  const byAgent = {};
  all.forEach(c=>{
    const shares = contractAgentShares(c);
    // شیرینی آبدارچی و شمارشِ قرارداد، به‌ازای هر قرارداد یک‌بار به مشاورِ اصلی آن نسبت داده می‌شود
    // (نه به هر مشاورِ همکار)، تا دوبار حساب نشود؛ ولی سهمِ کمیسیون دقیقاً طبق درصد خودِ هر مشاور جدا می‌شود.
    shares.forEach((sh,i)=>{
      const a = sh.name || 'نامشخص';
      if(!byAgent[a]) byAgent[a]={count:0, commission:0, agentShare:0, shirini:0};
      byAgent[a].agentShare += sh.amount;
      if(i===0){ byAgent[a].count++; byAgent[a].commission += Number(c.commissionTotal||0); byAgent[a].shirini += Number(c.shiriniAbdarchi||0); }
    });
  });
  const maxCommission = Math.max(1, ...Object.values(byAgent).map(x=>x.commission));
  const kindLabel={rent:'اجاره',sale:'فروش',mosharekat:'مشارکت'};
  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="n">${toFa(totalCommission)}</div><div class="l">جمع کل کمیسیون (تومان)</div></div>
    <div class="stat-card"><div class="n">${toFa(totalAgentShare)}</div><div class="l">جمع سهم مشاوران (تومان)</div></div>
    <div class="stat-card"><div class="n">${toFa(totalOfficeShare)}</div><div class="l">جمع سهم دفتر (تومان)</div></div>
    <div class="stat-card"><div class="n">${toFa(totalShirini)}</div><div class="l">جمع شیرینی آبدارچی (تومان)</div></div>
    <div class="stat-card"><div class="n">${all.length}</div><div class="l">تعداد قراردادهای دارای کمیسیون</div></div>
  </div>
  <div class="section-title">📊 سهم هر مشاور از کمیسیون</div>
  <div class="card">
    ${Object.keys(byAgent).length===0? `<div class="empty-state"><div class="ic">📊</div>هنوز کمیسیونی ثبت نشده است</div>` :
    Object.entries(byAgent).map(([a,v])=>`
      <div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px">
          <span>${esc(a)} (${v.count} قرارداد)</span><span>${toFa(v.agentShare)} تومان</span>
        </div>
        <div style="background:var(--paper);border-radius:8px;height:10px;overflow:hidden">
          <div style="background:linear-gradient(90deg,var(--gold),var(--gold-2));height:100%;width:${(v.commission/maxCommission*100).toFixed(1)}%"></div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">سهم این مشاور از کمیسیون: ${toFa(v.agentShare)} تومان${v.shirini?` — شیرینی آبدارچی: ${toFa(v.shirini)} تومان`:''}</div>
      </div>`).join('')}
  </div>
  <div class="section-title">📋 لیست کامل تراکنش‌های کمیسیون</div>
  <div class="table-wrap"><table><thead><tr><th>نوع</th><th>آدرس</th><th>مشاور(ان)</th><th>کمیسیون کل</th><th>سهم مشاوران</th><th>مبلغ سهم مشاوران</th><th>سهم دفتر</th><th>شیرینی آبدارچی</th><th>تاریخ</th></tr></thead><tbody>
  ${all.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(c=>{
    const shares = contractAgentShares(c);
    const agentAmt = contractAgentShareTotal(c);
    const agentsCol = shares.map(s=>esc(s.name)).join('، ');
    const percentCol = shares.map(s=>s.percent+'٪').join('، ');
    return `<tr><td>${kindLabel[c.kind]}</td><td>${esc((c.address||'').slice(0,28))}</td><td>${agentsCol}</td><td>${toFa(c.commissionTotal)}</td><td>${percentCol}</td><td>${toFa(agentAmt)}</td><td>${toFa(Number(c.commissionTotal||0)-agentAmt)}</td><td>${toFa(c.shiriniAbdarchi||0)}</td><td>${faDate(c.startDate||c.contractDate)}</td></tr>`;
  }).join('')}
  </tbody></table></div>`;
}

function pageCommissionCalculator(){
  UI.commissionCalc = UI.commissionCalc || { mode:'rent', rahn:'', ejare:'', totalPrice:'' };
  const st = UI.commissionCalc;
  const rahnId='cc-rahn', ejareId='cc-ejare', totalId='cc-total';
  let resultHtml;
  if(st.mode==='rent'){
    const calc = computeContractCommission('rent', { rahnPrice:st.rahn, ejarePrice:st.ejare }) || {oneSide:0,total:0};
    resultHtml = `
      <div class="cc-result-title">🧾 نتیجه‌ی محاسبه — رهن و اجاره</div>
      <div class="cc-result-row"><span>کمیسیون یک طرف (مالک یا مستاجر)</span><b>${toFa(calc.oneSide)} تومان</b></div>
      <div class="cc-result-row main"><span>جمع کل (هر دو طرف)</span><b>${toFa(calc.total)} تومان</b></div>
      <div class="cc-result-words">${numberToWordsFa(calc.total)}</div>`;
  } else {
    const calc = computeContractCommission('sale', { totalPrice:st.totalPrice }) || {sellerShare:0,buyerShare:0,total:0};
    resultHtml = `
      <div class="cc-result-title">🧾 نتیجه‌ی محاسبه — خرید و فروش</div>
      <div class="cc-result-row"><span>سهم فروشنده</span><b>${toFa(calc.sellerShare)} تومان</b></div>
      <div class="cc-result-row"><span>سهم خریدار</span><b>${toFa(calc.buyerShare)} تومان</b></div>
      <div class="cc-result-row main"><span>جمع کل کمیسیون دفتر</span><b>${toFa(calc.total)} تومان</b></div>
      <div class="cc-result-words">${numberToWordsFa(calc.total)}</div>`;
  }
  return `
  <div class="cc-hero">
    <h2>🧮 ماشین‌حساب کمیسیون</h2>
    <p>مبلغ رهن/اجاره یا قیمت کل معامله را وارد کنید تا کمیسیون بر اساس فرمول رسمی دفتر — همراه با ۱۰٪ ارزش‌افزوده — به‌صورت آنی محاسبه شود.</p>
  </div>
  <div class="cc-grid">
    <div class="cc-card">
      <div class="cc-tabs">
        <div class="cc-tab ${st.mode==='rent'?'active':''}" onclick="UI.commissionCalc.mode='rent';renderApp();">🔑 رهن و اجاره</div>
        <div class="cc-tab ${st.mode==='sale'?'active':''}" onclick="UI.commissionCalc.mode='sale';renderApp();">💰 خرید و فروش</div>
      </div>
      ${st.mode==='rent'? `
        <div class="cc-field">
          <label>مبلغ رهن (تومان)</label>
          <input id="${rahnId}" type="text" inputmode="numeric" placeholder="مثال: 200,000,000" value="${st.rahn!==''? toFa(st.rahn):''}"
            oninput="const d=this.value.replace(/[^\\d]/g,''); UI.commissionCalc.rahn=d===''?'':Number(d); refocusAfterRender('${rahnId}');">
        </div>
        <div class="cc-field">
          <label>اجاره ماهیانه (تومان)</label>
          <input id="${ejareId}" type="text" inputmode="numeric" placeholder="مثال: 8,000,000" value="${st.ejare!==''? toFa(st.ejare):''}"
            oninput="const d=this.value.replace(/[^\\d]/g,''); UI.commissionCalc.ejare=d===''?'':Number(d); refocusAfterRender('${ejareId}');">
        </div>
        <div class="cc-note">فرمول: (هر ۱,۰۰۰,۰۰۰ تومان رهن ← ۱۵,۰۰۰ تومان) + (یک‌سوم اجاره ماهیانه)، سپس ۱۰٪ ارزش‌افزوده به کل اضافه می‌شود. مبلغ «یک طرف» برای مالک یا مستاجر است؛ برای هر دو طرف، دو برابر می‌شود.</div>
      ` : `
        <div class="cc-field">
          <label>مبلغ کل معامله (تومان)</label>
          <input id="${totalId}" type="text" inputmode="numeric" placeholder="مثال: 3,000,000,000" value="${st.totalPrice!==''? toFa(st.totalPrice):''}"
            oninput="const d=this.value.replace(/[^\\d]/g,''); UI.commissionCalc.totalPrice=d===''?'':Number(d); refocusAfterRender('${totalId}');">
        </div>
        <div class="cc-note">فرمول: ۱٪ از مبلغ کل معامله (نیم‌درصد سهم فروشنده، نیم‌درصد سهم خریدار)، سپس روی سهم هر طرف ۱۰٪ ارزش‌افزوده اضافه می‌شود.</div>
      `}
    </div>
    <div class="cc-result">${resultHtml}</div>
  </div>`;
}

/* ---------- محافظ رندر در برابر «کلیک از دست‌رفته» ----------
   اگر همین چند صدم ثانیه پیش کاربر انگشتش را روی صفحه گذاشته (یعنی احتمالاً وسط
   یک لمس/کلیک است) و در همین حین یک رندر پس‌زمینه‌ای (مثلاً از poll دوره‌ای یا از
   پایان یک ذخیره‌سازی ناهم‌زمان دیگر) فراخوانی شود، کل appEl.innerHTML عوض می‌شود؛
   اگر این عوض‌شدن دقیقاً بین mousedown و click اتفاق بیفتد، مرورگر دیگر رویداد
   click را برای المان (که از DOM حذف شده) صادر نمی‌کند و کاربر حس می‌کند «روی
   دکمه کلیک کردم ولی هیچ اتفاقی نیفتاد». راه‌حل: چنین رندرهایی را کمی به تعویق
   می‌اندازیم تا کلیک جاری فرصت اجرا شدن پیدا کند؛ خودِ کلیک کاربر که renderApp
   را مستقیماً صدا می‌زند مشکلی ندارد چون آن لحظه، رویداد کلیک از قبل با موفقیت
   شلیک شده است. */
let __lastPointerAt = 0;
document.addEventListener('pointerdown', ()=>{ __lastPointerAt = Date.now(); }, true);
document.addEventListener('touchstart', ()=>{ __lastPointerAt = Date.now(); }, true);
let __renderGuardTimer = null;
function renderApp(){
  const sinceTouch = Date.now() - __lastPointerAt;
  if(sinceTouch >= 0 && sinceTouch < 280){
    clearTimeout(__renderGuardTimer);
    __renderGuardTimer = setTimeout(renderAppImmediate, 280 - sinceTouch);
    return;
  }
  renderAppImmediate();
}

function logout(){
  // اگر هنوز تغییری هست که موفق به ذخیره روی سرور نشده (مثلاً به‌خاطر قطع موقت اینترنت)
  // و در پس‌زمینه در حال تلاش مجدد است، خروج نباید بی‌سروصدا آن را از بین ببرد.
  if(__unsavedCollections.size>0){
    if(!confirm('برخی تغییرات هنوز روی سرور ذخیره نشده‌اند (اتصال اینترنت ناپایدار است). اگر الان خارج شوید، این تغییرات ممکن است از دست بروند. مطمئنید می‌خواهید خارج شوید؟')) return;
  }
  Object.keys(__bgRetryTimers).forEach(k=>{ clearInterval(__bgRetryTimers[k]); delete __bgRetryTimers[k]; });
  __unsavedCollections.clear(); updateUnsavedBanner();
  if(TOKEN){ apiFetch('/api/logout', {method:'POST'}).catch(()=>{}); }
  TOKEN=null; localStorage.removeItem('sl_token');
  SESSION=null; UI={page:'dashboard', tab:{}, search:{}, sort:{}, priceMin:{}, priceMax:{}, filterAgent:'', sidebarOpen:false, view:{}};
  renderLogin();
}

let __needsSetup = null; // نتیجه بررسی سرور: آیا هنوز هیچ حسابی ساخته نشده؟
async function renderLogin(){
  document.getElementById('app-screen').style.display='none';
  const el = document.getElementById('login-screen');
  el.style.display='flex';
  el.style.cssText='min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy),var(--navy-2));padding:24px;';
  el.innerHTML = `<div class="spinner-wrap"><div class="spinner"></div><div>در حال اتصال به سرور…</div></div>`;

  let status;
  try{
    const res = await fetch(API_BASE+'/api/setup-status');
    status = await res.json();
  }catch(e){
    el.innerHTML = `<div class="login-card" style="text-align:center">
      <div class="brand"><img src="${LOGO_FULL}" alt="اسپرلوس" style="width:170px;max-width:70%;margin:0 auto 8px;display:block"></div>
      <div class="hint" style="color:var(--danger)">اتصال به سرور برقرار نشد.<br>از اینکه سرور روشن است و آدرس درست وارد شده مطمئن شوید.</div>
      <button class="btn btn-outline btn-block" style="margin-top:12px" onclick="renderLogin()">تلاش دوباره</button>
    </div>`;
    return;
  }
  __needsSetup = status.needsSetup;

  if(__needsSetup){
    el.innerHTML = `
    <div class="login-card">
      <div class="brand"><img src="${LOGO_FULL}" alt="اسپرلوس" style="width:170px;max-width:70%;margin:0 auto 8px;display:block"><p>راه‌اندازی اولیه سامانه</p></div>
      <div class="hint" style="margin-bottom:14px;text-align:right">هنوز هیچ حسابی ساخته نشده. ابتدا یک حساب <b>مدیر دفتر</b> بسازید. پس از ورود، از بخش «مدیریت مشاوران» می‌توانید برای هر مشاور نام کاربری و رمز اختصاصی بسازید.</div>
      <div class="field"><label>نام مدیر</label><input type="text" id="setup-name" placeholder="مثال: مدیر دفتر"></div>
      <div class="field"><label>نام کاربری</label><input type="text" id="setup-username" placeholder="مثال: admin"></div>
      <div class="field"><label>رمز عبور</label><input type="password" id="setup-password" placeholder="یک رمز عبور امن انتخاب کنید"></div>
      <button class="btn btn-gold btn-block" onclick="doFirstSetup()">ساخت حساب مدیر و ورود</button>
    </div>`;
    return;
  }
  el.innerHTML = `
  <div class="login-card">
    <div class="brand"><img src="${LOGO_FULL}" alt="اسپرلوس" style="width:170px;max-width:70%;margin:0 auto 8px;display:block"><p>سامانه مدیریت املاک</p></div>
    <div class="field"><label>نام کاربری</label><input type="text" id="login-username" placeholder="نام کاربری شما"></div>
    <div class="field"><label>رمز عبور</label><input type="password" id="login-password" placeholder="رمز عبور"></div>
    <button class="btn btn-gold btn-block" onclick="doLogin()">ورود به سامانه</button>
    <div class="hint">نام کاربری و رمز عبور خود را از مدیر دفتر بگیرید.<br>اطلاعات بین همه دستگاه‌های متصل به این سرور به‌صورت زنده همگام‌سازی می‌شود.</div>
  </div>`;
  setTimeout(()=>{
    const p = document.getElementById('login-password');
    if(p) p.onkeydown=(e)=>{ if(e.key==='Enter') doLogin(); };
  },0);
}
async function doFirstSetup(){
  const name=(document.getElementById('setup-name').value||'').trim();
  const username=(document.getElementById('setup-username').value||'').trim().toLowerCase();
  const password=document.getElementById('setup-password').value||'';
  if(!name||!username||!password){ toast('همه فیلدها را پر کنید'); return; }
  if(password.length<4){ toast('رمز عبور باید حداقل ۴ کاراکتر باشد'); return; }
  try{
    const r = await fetch(API_BASE+'/api/setup', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,username,password})});
    const body = await r.json();
    if(!r.ok){ toast(body.error==='already_setup'? 'سامانه قبلاً راه‌اندازی شده':'خطا در راه‌اندازی'); return; }
    TOKEN = body.token; localStorage.setItem('sl_token', TOKEN);
    SESSION = { role: body.account.role, name: body.account.name, username: body.account.username, accountId: body.account.id };
    await loadAllWithRetry();
    __lastUnreadChat = unreadChatCount();
    UI.page='admin_dashboard';
    renderApp();
  }catch(e){ toast('اتصال به سرور برقرار نشد'); }
}
async function doLogin(){
  const username=(document.getElementById('login-username').value||'').trim().toLowerCase();
  const password=document.getElementById('login-password').value||'';
  if(!username||!password){ toast('نام کاربری و رمز عبور را وارد کنید'); return; }
  try{
    const r = await fetch(API_BASE+'/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,password})});
    const body = await r.json();
    if(!r.ok){ toast('نام کاربری یا رمز عبور اشتباه است'); return; }
    TOKEN = body.token; localStorage.setItem('sl_token', TOKEN);
    SESSION = { role: body.account.role, name: body.account.name, username: body.account.username, accountId: body.account.id };
    await loadAllWithRetry();
    __lastUnreadChat = unreadChatCount();
    UI.page = body.account.role==='admin'? 'admin_dashboard':'dashboard';
    renderApp();
  }catch(e){ toast('اتصال به سرور برقرار نشد'); }
}

function addAgentAccount(){
  const root=document.getElementById('overlay-root');
  root.innerHTML=`<div class="modal"><h3>ساخت حساب مشاور جدید</h3>
    <div class="form-grid">
      <div class="field full"><label>نام و نام خانوادگی مشاور</label><input type="text" id="new-agent-name"></div>
      <div class="field"><label>نام کاربری</label><input type="text" id="new-agent-username"></div>

async function saveNewAgentAccount(){
  const name=(document.getElementById('new-agent-name').value||'').trim();
  const username=(document.getElementById('new-agent-username').value||'').trim().toLowerCase();
  const password=document.getElementById('new-agent-password').value||'';
  if(!name||!username||!password){ toast('همه فیلدها را پر کنید'); return; }
  try{
    await apiFetch('/api/accounts', {method:'POST', body: JSON.stringify({name,username,password})});
    toast('حساب مشاور ساخته شد ✓'); closeModal();
  }catch(e){
    toast(e.body && e.body.error==='username_taken' ? 'این نام کاربری قبلاً استفاده شده' : 'خطا در ساخت حساب');
    return;
  }
  try{ await loadAllWithRetry(); }catch(e){ /* حساب با موفقیت ساخته شد؛ فقط رفرش لیست موقتاً ناموفق بود، با poll بعدی درست می‌شود */ }

function editAgentAccount(id){
  const acc = DB.accounts.find(a=>a.id===id); if(!acc) return;
  const root=document.getElementById('overlay-root');
  root.innerHTML=`<div class="modal"><h3>ویرایش مشاور</h3>
    <div class="form-grid">
      <div class="field full"><label>نام و نام خانوادگی</label><input type="text" id="edit-agent-name" value="${esc(acc.name)}"></div>
      <div class="field"><label>نام کاربری</label><input type="text" id="edit-agent-username" value="${esc(acc.username)}"></div>
    </div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="saveEditAgentAccount('${id}')">ذخیره</button></div>
  </div>`;
  root.classList.add('show');
}
async function saveEditAgentAccount(id){
  const acc = DB.accounts.find(a=>a.id===id); if(!acc) return;
  const newName=(document.getElementById('edit-agent-name').value||'').trim();
  const newUsername=(document.getElementById('edit-agent-username').value||'').trim().toLowerCase();
  if(!newName||!newUsername){ toast('همه فیلدها را پر کنید'); return; }
  const oldName = acc.name;
  try{
    await apiFetch('/api/accounts/'+id, {method:'PUT', body: JSON.stringify({name:newName, username:newUsername})});
    // به‌روزرسانی agentName در تمام رکوردهای قبلی این مشاور
    if(oldName!==newName){
      [DB.files,DB.customers,DB.mMelk,DB.mSaz,DB.sazBank].forEach(coll=>coll.forEach(r=>{ if(r.agentName===oldName) r.agentName=newName; }));
      await Promise.all(['files','customers','mMelk','mSaz','sazBank'].map(saveCollection));
    }
    toast('ذخیره شد ✓'); closeModal();
  }catch(e){
    toast(e.body && e.body.error==='username_taken' ? 'این نام کاربری قبلاً استفاده شده' : 'خطا در ذخیره');
    return;
  }
  try{ await loadAllWithRetry(); }catch(e){ /* تغییرات با موفقیت ذخیره شد؛ فقط رفرش لیست موقتاً ناموفق بود */ }
  renderApp();
}
function resetAgentPassword(id){
  const acc = DB.accounts.find(a=>a.id===id); if(!acc) return;
  const root=document.getElementById('overlay-root');
  root.innerHTML=`<div class="modal"><h3>تغییر رمز عبور — ${esc(acc.name)}</h3>
    <div class="form-grid"><div class="field full"><label>رمز عبور جدید</label><input type="password" id="new-pass-val"></div></div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="saveNewPassword('${id}')">ذخیره</button></div>
  </div>`;
  root.classList.add('show');
}
async function saveNewPassword(id){
  const val = document.getElementById('new-pass-val').value||'';
  if(val.length<4){ toast('رمز عبور باید حداقل ۴ کاراکتر باشد'); return; }
  try{
    await apiFetch('/api/accounts/'+id, {method:'PUT', body: JSON.stringify({password:val})});
    toast('رمز عبور تغییر کرد ✓'); closeModal();
  }catch(e){ toast('خطا در تغییر رمز'); }
}
async function deleteAgentAccount(id){
  if(!confirm('این حساب مشاور حذف شود؟ (اطلاعات فایل و مشتری او حذف نمی‌شود)')) return;
  try{
    await apiFetch('/api/accounts/'+id, {method:'DELETE'});
    toast('حساب حذف شد');
  }catch(e){ toast('خطا در حذف حساب'); return; }
  try{ await loadAllWithRetry(); }catch(e){ /* حذف با موفقیت انجام شد؛ فقط رفرش لیست موقتاً ناموفق بود */ }
  renderApp();
}

/* =========================================================================
   ویرایش نام‌کاربری/رمز خودم — فقط برای مدیر (مشاوران این اجازه را ندارند؛
   نام‌کاربری/رمز مشاوران را فقط مدیر از صفحه‌ی «مدیریت حساب مشاوران» تعیین می‌کند)

function openMyAccountModal(){
  const root=document.getElementById('overlay-root');
  root.innerHTML=`<div class="modal"><h3>ویرایش اطلاعات ورود من</h3>
    <div class="form-grid">
      <div class="field full"><label>نام و نام خانوادگی</label><input type="text" id="my-acc-name" value="${esc(SESSION.name)}"></div>
      <div class="field full"><label>نام کاربری</label><input type="text" id="my-acc-username" value="${esc(SESSION.username||'')}"></div>
      <div class="field full"><label>رمز عبور جدید (اختیاری — اگر نمی‌خواهید عوض شود، خالی بگذارید)</label><input type="password" id="my-acc-password" placeholder="فقط در صورت تغییر پر کنید"></div>
    </div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="saveMyAccount()">ذخیره</button></div>
  </div>`;
  root.classList.add('show');
}
async function saveMyAccount(){
  const name=(document.getElementById('my-acc-name').value||'').trim();
  const username=(document.getElementById('my-acc-username').value||'').trim().toLowerCase();
  const password=document.getElementById('my-acc-password').value||'';
  if(!name||!username){ toast('نام و نام کاربری را پر کنید'); return; }
  if(password && password.length<4){ toast('رمز عبور جدید باید حداقل ۴ کاراکتر باشد'); return; }
  const body={name, username};
  if(password) body.password=password;
  try{
    const r = await apiFetch('/api/me', {method:'PUT', body: JSON.stringify(body)});
    SESSION.name=r.account.name; SESSION.username=r.account.username;
    toast('اطلاعات ورود شما به‌روزرسانی شد ✓'); closeModal(); renderApp();
  }catch(e){
    toast(e.body && e.body.error==='username_taken' ? 'این نام کاربری قبلاً استفاده شده' : 'خطا در ذخیره');
  }
}

(async function init(){
  const favicon = document.createElement('link');
  favicon.rel = 'icon'; favicon.type = 'image/png'; favicon.href = LOGO_CREST;
  document.head.appendChild(favicon);
  document.getElementById('login-screen').innerHTML = `<div class="spinner-wrap"><div class="spinner"></div><div>در حال بارگذاری…</div></div>`;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-screen').style.cssText='min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy),var(--navy-2))';
  if(TOKEN){
    try{
      const r = await fetch(API_BASE+'/api/me', {headers:{'Authorization':'Bearer '+TOKEN}});
      if(r.ok){
        const body = await r.json();
        SESSION = { role: body.account.role, name: body.account.name, username: body.account.username, accountId: body.account.id };
        await loadAllWithRetry();
        __lastUnreadChat = unreadChatCount();
        UI.page = SESSION.role==='admin'? 'admin_dashboard':'dashboard';
        renderApp();
        return;
      } else {
        TOKEN=null; localStorage.removeItem('sl_token');
      }
    }catch(e){ /* سرور در دسترس نبود، به صفحه ورود می‌رویم */ }
  }
  renderLogin();
})();

/* ---------- افکت ریپل ظریف روی دکمه‌ها (فقط بصری، دخالتی در عملکرد کلیک‌ها ندارد) ---------- */
document.addEventListener('click', function(e){
  const btn = e.target.closest('.btn');
  if(!btn) return;
  const r = btn.getBoundingClientRect();
  const size = Math.max(r.width, r.height) * 1.4;
  const span = document.createElement('span');
  span.style.cssText = 'position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.45);'
    + 'width:'+size+'px;height:'+size+'px;left:'+(e.clientX - r.left - size/2)+'px;top:'+(e.clientY - r.top - size/2)+'px;'
    + 'transform:scale(0);opacity:1;transition:transform .5s cubic-bezier(.22,.61,.36,1),opacity .6s ease-out;';
  btn.appendChild(span);
  requestAnimationFrame(()=>{ span.style.transform='scale(1)'; span.style.opacity='0'; });
  setTimeout(()=>{ span.remove(); }, 650);
}, true);
</script>
